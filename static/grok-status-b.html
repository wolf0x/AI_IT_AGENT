<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 B：导航栏头像动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 800px;
  height: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  overflow: hidden;
}

/* 侧边栏 */
.sidebar {
  width: 220px;
  background: #2c3e50;
  color: white;
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid #34495e;
}
.logo-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* 方案 B：导航栏头像动画 */
.logo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3498db 0%, #2ecc71 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  position: relative;
  transition: all 0.3s ease;
}
.logo.active {
  animation: logoPulse 2s ease-in-out infinite;
}
.logo.active::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: inherit;
  animation: logoRipple 2s ease-out infinite;
}
@keyframes logoPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
@keyframes logoRipple {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.8); opacity: 0; }
}

.logo-text h2 {
  font-size: 16px;
  font-weight: 700;
}
.logo-text p {
  font-size: 11px;
  color: #95a5a6;
  margin-top: 2px;
}

.nav-tabs {
  padding: 8px;
  flex: 1;
}
.nav-tab {
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: background 0.2s;
}
.nav-tab:hover {
  background: #34495e;
}
.nav-tab.active {
  background: #3498db;
}

/* 主内容区 */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.chat-area {
  flex: 1;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
}
.message.user {
  background: #3498db;
  color: white;
  margin-left: 60px;
}
.message.assistant {
  background: white;
  border: 1px solid #e2e8f0;
  margin-right: 60px;
}

.input-area {
  padding: 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
}
.input-box {
  display: flex;
  gap: 8px;
}
.input-box input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.controls {
  padding: 16px;
  background: #f8f9fa;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
}
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo-container">
        <!-- 方案 B：导航栏头像动画 -->
        <div class="logo" id="logo">🐺</div>
        <div class="logo-text">
          <h2>RustAgent</h2>
          <p>AI System Agent</p>
        </div>
      </div>
    </div>
    <div class="nav-tabs">
      <div class="nav-tab active">💬 Chat</div>
      <div class="nav-tab">⚙️ Settings</div>
      <div class="nav-tab">🧠 Skills</div>
      <div class="nav-tab">📊 Dashboard</div>
    </div>
  </div>
  
  <div class="main-content">
    <div class="chat-area">
      <div class="message user">分析这台主机的安全状况</div>
      <div class="message assistant">🧭 Manager Plan (Round 1)<br>Subtask: 执行系统信息收集...</div>
    </div>
    
    <div class="input-area">
      <div class="input-box">
        <input type="text" placeholder="输入消息..." />
        <button class="send-btn">➤</button>
      </div>
    </div>
    
    <div class="controls">
      <button class="btn btn-primary" onclick="startExecution()">模拟开始执行</button>
      <button class="btn btn-secondary" onclick="stopExecution()">模拟停止</button>
    </div>
  </div>
</div>

<script>
function startExecution() {
  document.getElementById('logo').classList.add('active');
}

function stopExecution() {
  document.getElementById('logo').classList.remove('active');
}
</script>
</body>
</html>
