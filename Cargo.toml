[package]
name = "rust-agent"
version = "0.8.0"
edition = "2021"
description = "Local AI agent with WebSocket gateway, multi-model support, and Windows system tools"

[[bin]]
name = "RustAgent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
glob = "0.3"
mime_guess = "2"
tokio-stream = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
rmcp = { version = "1", features = ["client", "transport-child-process", "client-side-sse", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest", "schemars"] }
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.3"
chromiumoxide = "0.9"
# Malware analysis dependencies (from hacksguard)
goblin = "0.9"
memmap2 = "0.9"
rayon = "1.10"
boreal = { version = "1.1.0", features = ["serialize"] }
iced-x86 = "1.21.0"
base64 = "0.22.1"
md-5 = "0.10"
sha1 = "0.10"
# Log analysis tools (from RavenEye migration)
regex = "1"
evtx = "0.8"
# PCAP analysis
pcap-parser = { version = "0.17", features = ["data"] }
# Linux IR — SSH remote execution (pure Rust)
russh = "0.49"
russh-keys = "0.49"
ssh-key = "0.6"
dirs-next = "2.0"
# Computer Use — Windows native desktop control
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
]}
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
opt-level = 3
lto = true
