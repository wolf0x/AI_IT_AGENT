<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C4：输入框上方悬浮卡片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.chat-area {
  height: 400px;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
}
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

/* C4：输入框上方悬浮卡片 */
.input-area {
  padding: 12px 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
  position: relative;
}
.float-card {
  position: absolute;
  bottom: 100%;
  left: 16px;
  right: 16px;
  transform: translateY(8px);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid #e2e8f0;
}
.float-card.active {
  transform: translateY(-4px);
  opacity: 1;
}
.float-card-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.float-card-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  animation: iconPulse 2s ease-in-out infinite;
}
@keyframes iconPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.float-card-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.float-card-title {
  font-size: 12px;
  font-weight: 700;
  color: #2c3e50;
}
.float-card-subtitle {
  font-size: 10px;
  color: #95a5a6;
}
.float-card-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.circular-progress {
  width: 32px;
  height: 32px;
  position: relative;
}
.circular-progress svg {
  transform: rotate(-90deg);
}
.circular-progress circle {
  fill: none;
  stroke-width: 3;
}
.circular-progress .bg {
  stroke: #e2e8f0;
}
.circular-progress .fill {
  stroke: url(#gradient);
  stroke-linecap: round;
  stroke-dasharray: 88;
  stroke-dashoffset: 88;
  transition: stroke-dashoffset 0.3s ease;
}
.circular-progress .text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 9px;
  font-weight: 700;
  color: #2c3e50;
}

.input-box {
  display: flex;
  gap: 8px;
  align-items: center;
}
.input-box input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.controls {
  padding: 16px;
  background: #f8f9fa;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
}
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">分析这台主机的安全状况</div>
    <div class="message assistant">🧭 Manager Plan (Round 1)<br>Subtask: 执行系统信息收集...</div>
  </div>
  
  <div class="input-area">
    <!-- C4：悬浮卡片 -->
    <div class="float-card" id="floatCard">
      <svg width="0" height="0">
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#667eea"/>
            <stop offset="100%" stop-color="#764ba2"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="float-card-left">
        <div class="float-card-icon">⚙️</div>
        <div class="float-card-info">
          <div class="float-card-title" id="cardTitle">Expert 模式执行中</div>
          <div class="float-card-subtitle" id="cardSubtitle">Round 3/10 · Executor 执行中</div>
        </div>
      </div>
      <div class="float-card-right">
        <div class="circular-progress">
          <svg width="32" height="32">
            <circle class="bg" cx="16" cy="16" r="14"/>
            <circle class="fill" id="circleFill" cx="16" cy="16" r="14"/>
          </svg>
          <span class="text" id="progressText">0%</span>
        </div>
      </div>
    </div>
    
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startExecution()">模拟开始执行</button>
    <button class="btn btn-secondary" onclick="stopExecution()">模拟停止</button>
  </div>
</div>

<script>
let progressInterval;
let progress = 0;
const circumference = 2 * Math.PI * 14; // 88

function startExecution() {
  document.getElementById('floatCard').classList.add('active');
  progress = 0;
  progressInterval = setInterval(() => {
    progress = (progress + 5) % 100;
    const offset = circumference - (progress / 100) * circumference;
    document.getElementById('circleFill').style.strokeDashoffset = offset;
    document.getElementById('progressText').textContent = progress + '%';
  }, 500);
}

function stopExecution() {
  document.getElementById('floatCard').classList.remove('active');
  clearInterval(progressInterval);
}
</script>
</body>
</html>
