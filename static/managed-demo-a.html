<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo A — Inline Toggle (Input Bar)</title>
<style>
:root { --t1:#1e293b; --t2:#475569; --t3:#94a3b8; --border:#e2e8f0; --rs:8px; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f1f5f9; color:var(--t1); display:flex; align-items:center; justify-content:center; min-height:100vh; }

.demo-wrap { width:720px; background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.08); overflow:hidden; }
.demo-header { padding:16px 20px; background:#f8f9fa; border-bottom:1px solid #ecf0f1; font-size:12px; color:var(--t3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }

/* ── Input bar (mirrors real app) ── */
.input-bar { display:flex; align-items:flex-end; gap:10px; padding:16px 20px; background:#f8f9fa; border-top:1px solid #ecf0f1; }
.input-bar textarea { flex:1; padding:12px 16px; background:white; border:1px solid #bdc3c7; border-radius:var(--rs); color:var(--t1); font-size:14px; outline:0; font-family:inherit; height:44px; resize:none; line-height:1.4; }
.input-bar textarea:focus { border-color:#3498db; box-shadow:0 0 0 3px rgba(52,152,219,.1); }
.btn { height:44px; display:flex; align-items:center; padding:10px 24px; border:none; border-radius:var(--rs); font-size:14px; font-weight:600; cursor:pointer; transition:all .15s; }
.btn-p { background:#3498db; color:#fff; }
.btn-p:hover { background:#2980b9; }
.btn-img { height:44px; width:44px; display:flex; align-items:center; justify-content:center; padding:0; background:#e8f4fd; border:1px solid #3498db; border-radius:var(--rs); cursor:pointer; font-size:20px; color:#3498db; flex-shrink:0; }

/* ── Demo A: Compact inline toggle ── */
.managed-toggle { display:flex; align-items:center; gap:6px; padding:0 8px; height:44px; background:white; border:1px solid #bdc3c7; border-radius:var(--rs); cursor:pointer; transition:all .2s; flex-shrink:0; user-select:none; }
.managed-toggle:hover { border-color:#3498db; background:#f0f8ff; }
.managed-toggle.active { border-color:#8e44ad; background:#f5eef8; }
.managed-toggle .mt-icon { font-size:16px; transition:transform .3s; }
.managed-toggle.active .mt-icon { transform:rotate(15deg); }
.managed-toggle .mt-label { font-size:12px; font-weight:600; color:var(--t2); white-space:nowrap; }
.managed-toggle.active .mt-label { color:#8e44ad; }
.managed-toggle .mt-switch { width:28px; height:16px; background:#bdc3c7; border-radius:16px; position:relative; transition:background .2s; flex-shrink:0; }
.managed-toggle .mt-switch::after { content:''; position:absolute; width:12px; height:12px; background:#fff; border-radius:50%; top:2px; left:2px; transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,.15); }
.managed-toggle.active .mt-switch { background:#8e44ad; }
.managed-toggle.active .mt-switch::after { transform:translateX(12px); }

/* ── Tooltip ── */
.tip { position:relative; }
.tip::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%) scale(.9); background:var(--t1); color:#fff; font-size:11px; padding:6px 10px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:all .15s; }
.tip:hover::after { opacity:1; transform:translateX(-50%) scale(1); }

/* ── Status indicator ── */
.status-bar { padding:10px 20px; background:#fff; border-top:1px solid #ecf0f1; font-size:12px; color:var(--t3); display:flex; align-items:center; gap:8px; }
.status-dot { width:8px; height:8px; border-radius:50%; background:#bdc3c7; }
.status-dot.active { background:#8e44ad; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
</style>
</head>
<body>
<div class="demo-wrap">
  <div class="demo-header">Demo A — Compact Inline Toggle</div>

  <div style="padding:40px 20px; text-align:center; color:var(--t2); font-size:14px;">
    Chat messages area...
  </div>

  <!-- Input bar with inline toggle -->
  <div class="input-bar">
    <button class="btn-img disabled" title="Attach image">&#128247;</button>
    <textarea placeholder="Type a message... (/ for skills, Shift+Enter for newline)"></textarea>

    <!-- Demo A: Compact inline toggle -->
    <div class="managed-toggle tip" data-tip="Enable managed mode for long-horizon tasks" id="managedToggle" onclick="toggleManaged()">
      <span class="mt-icon">&#9881;</span>
      <span class="mt-label">Managed</span>
      <div class="mt-switch"></div>
    </div>

    <button class="btn btn-p">Send</button>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Managed mode: OFF</span>
  </div>
</div>

<script>
let managedOn = false;
function toggleManaged() {
  managedOn = !managedOn;
  document.getElementById('managedToggle').classList.toggle('active', managedOn);
  document.getElementById('statusDot').classList.toggle('active', managedOn);
  document.getElementById('statusText').textContent = 'Managed mode: ' + (managedOn ? 'ON' : 'OFF');
}
</script>
</body>
</html>
