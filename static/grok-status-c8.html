<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C8：Expert 模式 + 悬浮卡片 + 完整信息</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 700px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.chat-area { height: 360px; background: #f7f9fa; padding: 20px; overflow-y: auto; }
.message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

/* Expert 悬浮卡片 */
.input-area {
  padding: 12px 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
  position: relative;
}
.float-card {
  position: absolute;
  bottom: 100%;
  left: 12px;
  right: 12px;
  transform: translateY(8px);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  background: white;
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  padding: 14px 18px;
  border: 1px solid #e2e8f0;
}
.float-card.active {
  transform: translateY(-6px);
  opacity: 1;
}

/* 卡片头部：模式 + 轮次 + 角色 */
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.card-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-badge {
  font-weight: 700;
  font-size: 10px;
  padding: 3px 8px;
  background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
  color: white;
  border-radius: 6px;
}
.round-info {
  font-size: 13px;
  font-weight: 700;
  color: #2c3e50;
}
.role-badge {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
}
.role-manager { background: #fff3cd; color: #856404; }
.role-executor { background: #d1ecf1; color: #0c5460; }
.role-auditor { background: #d4edda; color: #155724; }

/* IR 阶段指示器 */
.ir-stages {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-bottom: 10px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.ir-stage {
  padding: 4px 8px;
  border-radius: 6px;
  background: #ecf0f1;
  color: #95a5a6;
  font-size: 10px;
  font-weight: 600;
  transition: all 0.3s ease;
  white-space: nowrap;
  flex-shrink: 0;
}
.ir-stage.active {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  transform: scale(1.05);
  box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
}
.ir-stage.done {
  background: #2ecc71;
  color: white;
}
.ir-arrow { font-size: 8px; color: #bdc3c7; flex-shrink: 0; }

/* 底部信息栏 */
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  border-top: 1px solid #f0f0f0;
}
.findings-info {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #7f8c8d;
}
.findings-count {
  font-weight: 700;
  color: #2c3e50;
}
.time-info {
  font-size: 11px;
  color: #95a5a6;
}

.input-box { display: flex; gap: 8px; align-items: center; }
.input-box input {
  flex: 1; padding: 10px 14px; border: 1px solid #e2e8f0;
  border-radius: 20px; font-size: 14px; outline: none;
}
.send-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white; cursor: pointer; font-size: 18px;
}

.controls { padding: 16px; background: #f8f9fa; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 12px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">深度分析这台主机，检查所有入侵痕迹并生成报告</div>
    <div class="message assistant">🧭 Manager Plan (Round 3)<br>Subtask: 分析事件日志和网络连接...</div>
  </div>
  
  <div class="input-area">
    <div class="float-card" id="floatCard">
      <div class="card-header">
        <div class="card-header-left">
          <span class="mode-badge">EXPERT</span>
          <span class="round-info" id="roundInfo">Round 3/10</span>
        </div>
        <span class="role-badge role-executor" id="roleBadge">Executor 执行中</span>
      </div>
      
      <div class="ir-stages" id="irStages">
        <span class="ir-stage done">Collection</span>
        <span class="ir-arrow">→</span>
        <span class="ir-stage done">Analysis</span>
        <span class="ir-arrow">→</span>
        <span class="ir-stage active">Attribution</span>
        <span class="ir-arrow">→</span>
        <span class="ir-stage">Containment</span>
        <span class="ir-arrow">→</span>
        <span class="ir-stage">Eradication</span>
        <span class="ir-arrow">→</span>
        <span class="ir-stage">Reporting</span>
      </div>
      
      <div class="card-footer">
        <div class="findings-info">
          <span>🔍</span>
          <span>已发现 <span class="findings-count" id="findingsCount">3</span> 个 findings</span>
        </div>
        <div class="time-info" id="timeInfo">已用时 2:34</div>
      </div>
    </div>
    
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startExpert()">开始 Expert</button>
    <button class="btn btn-secondary" onclick="nextRole()">切换角色</button>
    <button class="btn btn-secondary" onclick="nextPhase()">下一阶段</button>
    <button class="btn btn-secondary" onclick="addFinding()">+ Finding</button>
    <button class="btn btn-secondary" onclick="stopExpert()">停止</button>
  </div>
</div>

<script>
const phases = ['Collection', 'Analysis', 'Attribution', 'Containment', 'Eradication', 'Reporting'];
const roles = [
  { name: 'Manager 规划中', class: 'role-manager' },
  { name: 'Executor 执行中', class: 'role-executor' },
  { name: 'Auditor 验证中', class: 'role-auditor' }
];
let currentPhase = 2;
let currentRole = 1;
let round = 3;
let findings = 3;
let startTime = Date.now() - 154000; // 2:34 ago
let timeInterval;

function startExpert() {
  document.getElementById('floatCard').classList.add('active');
  startTime = Date.now();
  updateDisplay();
  timeInterval = setInterval(updateTime, 1000);
}

function nextRole() {
  currentRole = (currentRole + 1) % roles.length;
  if (currentRole === 0) {
    round++;
    document.getElementById('roundInfo').textContent = `Round ${round}/10`;
  }
  updateDisplay();
}

function nextPhase() {
  currentPhase = (currentPhase + 1) % phases.length;
  updateDisplay();
}

function addFinding() {
  findings++;
  document.getElementById('findingsCount').textContent = findings;
}

function updateTime() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  document.getElementById('timeInfo').textContent = `已用时 ${mins}:${secs.toString().padStart(2, '0')}`;
}

function updateDisplay() {
  const role = roles[currentRole];
  const badge = document.getElementById('roleBadge');
  badge.textContent = role.name;
  badge.className = 'role-badge ' + role.class;
  
  const stages = document.getElementById('irStages');
  const stageElements = stages.querySelectorAll('.ir-stage');
  stageElements.forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i < currentPhase) el.classList.add('done');
    else if (i === currentPhase) el.classList.add('active');
  });
}

function stopExpert() {
  document.getElementById('floatCard').classList.remove('active');
  clearInterval(timeInterval);
}
</script>
</body>
</html>
