<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 D：全局脉冲边框</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* 方案 D：全局脉冲边框 */
.container {
  width: 700px;
  height: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  transition: box-shadow 0.3s ease;
}
.container.active {
  animation: containerPulse 2s ease-in-out infinite;
}
@keyframes containerPulse {
  0%, 100% { 
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 
                0 0 0 0 rgba(102, 126, 234, 0.6),
                inset 0 0 20px rgba(102, 126, 234, 0.1);
  }
  50% { 
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 
                0 0 0 20px rgba(118, 75, 162, 0),
                inset 0 0 30px rgba(118, 75, 162, 0.15);
  }
}

/* 顶部状态指示条 */
.status-indicator {
  height: 6px;
  background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #667eea 100%);
  background-size: 200% 100%;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.container.active .status-indicator {
  opacity: 1;
  animation: indicatorShift 1.5s linear infinite;
}
@keyframes indicatorShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.header {
  padding: 16px 20px;
  background: white;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3498db 0%, #2ecc71 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.header-title h2 {
  font-size: 16px;
  font-weight: 700;
}
.header-title p {
  font-size: 11px;
  color: #95a5a6;
}
.status-badge {
  padding: 6px 16px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 700;
  background: #95a5a6;
  color: white;
  opacity: 0;
  transition: opacity 0.3s ease;
  letter-spacing: 0.5px;
}
.container.active .status-badge {
  opacity: 1;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  animation: badgePulse 1.5s ease-in-out infinite;
  box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
}
@keyframes badgePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
  50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(46, 204, 113, 0.7); }
}

.chat-area {
  flex: 1;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
}
.message.user {
  background: #3498db;
  color: white;
  margin-left: 60px;
}
.message.assistant {
  background: white;
  border: 1px solid #e2e8f0;
  margin-right: 60px;
}

.input-area {
  padding: 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
}
.input-box {
  display: flex;
  gap: 8px;
}
.input-box input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.controls {
  padding: 16px;
  background: #f8f9fa;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
}
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container" id="container">
  <div class="status-indicator"></div>
  
  <div class="header">
    <div class="header-left">
      <div class="logo">🐺</div>
      <div class="header-title">
        <h2>RustAgent</h2>
        <p>Expert 模式</p>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">执行中</div>
  </div>
  
  <div class="chat-area">
    <div class="message user">分析这台主机的安全状况</div>
    <div class="message assistant">🧭 Manager Plan (Round 1)<br>Subtask: 执行系统信息收集...</div>
    <div class="message assistant">✅ Auditor 验证通过<br>发现: 系统信息已收集</div>
  </div>
  
  <div class="input-area">
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startExecution()">模拟开始执行</button>
    <button class="btn btn-secondary" onclick="stopExecution()">模拟停止</button>
  </div>
</div>

<script>
function startExecution() {
  document.getElementById('container').classList.add('active');
}

function stopExecution() {
  document.getElementById('container').classList.remove('active');
}
</script>
</body>
</html>
