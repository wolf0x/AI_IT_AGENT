<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Demo C - Compact Cards</title>
<style>
:root {
  --t1: #1e293b; --t2: #475569; --t3: #94a3b8;
  --border: #e2e8f0; --rs: 8px; --mono: 'Consolas', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: var(--t1); }

.settings-scroll { padding: 16px; max-width: 880px; margin: 0 auto; }

/* Demo C: Compact Cards with inline fields */
.settings-section {
  background: white;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: #f8fafc;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.section-header h3 {
  font-size: 12px; font-weight: 600; color: var(--t1);
  display: flex; align-items: center; gap: 6px; margin: 0;
}
.section-header .chevron {
  font-size: 10px; color: var(--t3); transition: transform 0.2s;
}
.section-header.collapsed .chevron { transform: rotate(-90deg); }
.section-body { padding: 12px 14px; }
.section-body.collapsed { display: none; }

/* Compact form fields - inline pairs */
.field-pair {
  display: flex; gap: 10px; margin-bottom: 8px;
}
.field-pair:last-child { margin-bottom: 0; }
.field {
  flex: 1; display: flex; flex-direction: column;
}
.field label {
  font-size: 10px; font-weight: 500; color: var(--t3);
  text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 3px;
}
.field input, .field select {
  padding: 6px 8px; background: #f8fafc;
  border: 1px solid var(--border); border-radius: 5px;
  color: var(--t1); font-size: 12px; outline: none;
}
.field input:focus, .field select:focus {
  border-color: #3b82f6; background: white;
}
.field.full { flex: 0 0 100%; }

/* Buttons */
.btn-row { display: flex; gap: 6px; margin-top: 10px; }
.btn {
  padding: 5px 10px; border-radius: 5px; font-size: 11px;
  font-weight: 500; cursor: pointer; border: none;
}
.btn-p { background: #3b82f6; color: white; }
.btn-s { background: #f1f5f9; color: var(--t2); border: 1px solid var(--border); }
.btn-d { background: #ef4444; color: white; }

/* Toggle */
.toggle { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider {
  position: absolute; cursor: pointer; inset: 0;
  background: #cbd5e1; border-radius: 18px; transition: 0.2s;
}
.toggle .slider:before {
  content: ""; position: absolute; height: 12px; width: 12px;
  left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s;
}
.toggle input:checked + .slider { background: #3b82f6; }
.toggle input:checked + .slider:before { transform: translateX(14px); }

/* Inline toggle row */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0;
}
.toggle-row span { font-size: 12px; color: var(--t2); }

/* Provider list compact */
.provider-list { font-size: 11px; color: var(--t2); margin-top: 8px; }
.provider-list div {
  display: flex; justify-content: space-between;
  padding: 4px 0; border-bottom: 1px solid #f8fafc;
}

/* Config tabs */
.tabs { display: flex; gap: 2px; margin-bottom: 8px; }
.tab {
  padding: 3px 8px; font-size: 10px; border-radius: 3px;
  cursor: pointer; background: #f1f5f9; color: var(--t2);
}
.tab.active { background: #3b82f6; color: white; }

textarea {
  width: 100%; padding: 8px; background: #f8fafc;
  border: 1px solid var(--border); border-radius: 5px;
  font-size: 11px; font-family: var(--mono); resize: vertical;
}

/* Permission grid */
.perm-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
}
.perm-cell {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px; background: #f8fafc; border-radius: 5px;
}
.perm-cell span { font-size: 10px; color: var(--t2); }

/* Quick actions row */
.quick-actions {
  display: flex; gap: 6px;
}
.quick-actions .btn { flex: 1; text-align: center; }

/* Demo badge */
.demo-badge {
  position: fixed; top: 10px; right: 10px;
  background: #8b5cf6; color: white; padding: 6px 12px;
  border-radius: 6px; font-size: 12px; font-weight: 600;
  z-index: 1000;
}
</style>
</head>
<body>
<div class="demo-badge">Demo C: Compact Cards</div>
<div class="settings-scroll">

  <!-- Connection -->
  <div class="settings-section">
    <div class="section-header">
      <h3>🔗 Connection</h3>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field-pair">
        <div class="field" style="flex:2">
          <label>WebSocket URL</label>
          <input type="text" value="ws://localhost:7788/ws">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" value="123">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-p">Connect</button>
        <button class="btn btn-s">Disconnect</button>
      </div>
    </div>
  </div>

  <!-- Model + Provider combined -->
  <div class="settings-section">
    <div class="section-header">
      <h3>🤖 Model & Provider</h3>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field-pair">
        <div class="field">
          <label>Primary</label>
          <select><option>gpt-4o</option></select>
        </div>
        <div class="field">
          <label>Fallback</label>
          <select><option>None</option></select>
        </div>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9">
        <div class="field-pair">
          <div class="field">
            <label>Provider Name</label>
            <input type="text" placeholder="gpt-4o">
          </div>
          <div class="field">
            <label>Env Var</label>
            <input type="text" placeholder="OPENAI_API_KEY">
          </div>
        </div>
        <div class="field-pair">
          <div class="field full">
            <label>API Base URL</label>
            <input type="text" placeholder="https://api.openai.com/v1">
          </div>
        </div>
        <div class="field-pair">
          <div class="field">
            <label>API Key</label>
            <input type="password" placeholder="optional">
          </div>
          <div class="field">
            <label>Context</label>
            <input type="number" value="128000">
          </div>
          <div class="field">
            <label>Max Tokens</label>
            <input type="number" value="16384">
          </div>
          <div class="field" style="flex:0.5">
            <label>Temp</label>
            <input type="number" value="0.7" step="0.1">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-p">+ Add</button>
          <button class="btn btn-s">Cancel</button>
        </div>
        <div class="provider-list">
          <div><span>gpt-4o</span><span style="color:var(--t3)">api.openai.com</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Agent -->
  <div class="settings-section">
    <div class="section-header">
      <h3>⚙️ Agent</h3>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field-pair">
        <div class="field">
          <label>Iterations</label>
          <input type="number" value="100">
        </div>
        <div class="field">
          <label>Rabbit Hole</label>
          <input type="number" value="10">
        </div>
        <div class="field">
          <label>Ctx Thresh %</label>
          <input type="number" value="80">
        </div>
      </div>
      <div class="field-pair">
        <div class="field">
          <label>Timeout (s)</label>
          <input type="number" value="300">
        </div>
        <div class="field">
          <label>Retries</label>
          <input type="number" value="2">
        </div>
        <div class="field">
          <label>Timezone</label>
          <input type="number" value="8">
        </div>
      </div>
      <div class="toggle-row" style="margin-top:8px">
        <span>🖥️ Computer Use</span>
        <label class="toggle"><input type="checkbox"><span class="slider"></span></label>
      </div>
    </div>
  </div>

  <!-- Config -->
  <div class="settings-section">
    <div class="section-header">
      <h3>📄 Config Files</h3>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="tabs">
        <span class="tab active">AGENTS</span>
        <span class="tab">SOUL</span>
        <span class="tab">TOOLS</span>
        <span class="tab">MEMORY</span>
      </div>
      <textarea rows="6" placeholder="Select a file..."></textarea>
      <div class="btn-row">
        <button class="btn btn-p">Save</button>
        <button class="btn btn-s">Reload</button>
      </div>
    </div>
  </div>

  <!-- Session + Permissions combined -->
  <div class="settings-section">
    <div class="section-header">
      <h3>💾 Session & 🔐 Permissions</h3>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="quick-actions" style="margin-bottom:10px">
        <button class="btn btn-d">Clear Chat</button>
        <button class="btn btn-s">Export</button>
      </div>
      <label style="font-size:10px;color:var(--t3);text-transform:uppercase;margin-bottom:6px;display:block">Tool Permissions</label>
      <div class="perm-grid">
        <div class="perm-cell">
          <span>read</span>
          <label class="toggle"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="perm-cell">
          <span>write</span>
          <label class="toggle"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="perm-cell">
          <span>delete</span>
          <label class="toggle"><input type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="perm-cell">
          <span>modify</span>
          <label class="toggle"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="perm-cell">
          <span>execute</span>
          <label class="toggle"><input type="checkbox"><span class="slider"></span></label>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
// Toggle collapse
document.querySelectorAll('.section-header').forEach(header => {
  header.addEventListener('click', () => {
    header.classList.toggle('collapsed');
    header.nextElementSibling.classList.toggle('collapsed');
  });
});
</script>
</body>
</html>
