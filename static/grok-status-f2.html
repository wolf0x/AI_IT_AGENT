<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>F2：C5+C2 组合 - 进度条在顶部</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container { width: 650px; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
.chat-area { height: 380px; background: #f7f9fa; padding: 20px; overflow-y: auto; }
.message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

.input-area { background: white; border-top: 1px solid #e2e8f0; }

/* 状态条 */
.status-bar {
  height: 0;
  overflow: hidden;
  transition: all 0.3s ease;
  color: white;
}
.status-bar.active { height: auto; }

/* 呼吸进度条 - 顶部 */
.breath-bar-top {
  height: 4px;
  background: rgba(255,255,255,0.15);
  overflow: hidden;
}
.breath-fill {
  height: 100%;
  background: rgba(255,255,255,0.9);
  width: 0%;
  animation: breathe 3s ease-in-out infinite;
}
@keyframes breathe {
  0% { width: 0%; }
  50% { width: 100%; }
  100% { width: 0%; }
}

/* Instant 模式 */
.instant-status { background: linear-gradient(90deg, #3498db 0%, #2ecc71 100%); }
.instant-content { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.instant-left { display: flex; align-items: center; gap: 10px; }
.mode-badge { font-weight: 700; font-size: 10px; padding: 3px 8px; background: rgba(255,255,255,0.25); border-radius: 6px; }
.stage-dots { display: flex; gap: 4px; align-items: center; }
.stage-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s; }
.stage-dot.active { background: white; transform: scale(1.3); }
.stage-dot.done { background: rgba(255,255,255,0.7); }
.stage-connector { width: 12px; height: 2px; background: rgba(255,255,255,0.3); }
.stage-connector.done { background: rgba(255,255,255,0.7); }

/* Expert 模式 */
.expert-status { background: linear-gradient(90deg, #8e44ad 0%, #9b59b6 100%); }
.expert-content { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.expert-left { display: flex; align-items: center; gap: 10px; }
.round-info { font-weight: 600; font-size: 11px; }
.stage-steps { display: flex; align-items: center; gap: 6px; }
.step { display: flex; align-items: center; gap: 4px; font-size: 11px; opacity: 0.5; transition: opacity 0.3s; }
.step.active { opacity: 1; font-weight: 600; }
.step.done { opacity: 0.8; }
.step-icon { font-size: 12px; }
.step-arrow { font-size: 10px; opacity: 0.5; }

.input-box { display: flex; gap: 8px; padding: 12px 16px; align-items: center; }
.input-box input { flex: 1; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 14px; outline: none; }
.send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%); color: white; cursor: pointer; font-size: 18px; }

.controls { padding: 16px; background: #f8f9fa; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-instant { background: #3498db; color: white; }
.btn-expert { background: #8e44ad; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user" id="userMsg">今天天气怎么样？</div>
    <div class="message assistant" id="assistantMsg">让我查询一下...</div>
  </div>
  
  <div class="input-area">
    <!-- Instant 模式 -->
    <div class="status-bar instant-status" id="instantBar">
      <div class="breath-bar-top"><div class="breath-fill"></div></div>
      <div class="instant-content">
        <div class="instant-left">
          <span class="mode-badge">INSTANT</span>
          <div class="stage-dots">
            <div class="stage-dot" id="dot1"></div>
            <div class="stage-connector" id="conn1"></div>
            <div class="stage-dot" id="dot2"></div>
            <div class="stage-connector" id="conn2"></div>
            <div class="stage-dot" id="dot3"></div>
          </div>
        </div>
        <span id="instantText">思考中...</span>
      </div>
    </div>
    
    <!-- Expert 模式 -->
    <div class="status-bar expert-status" id="expertBar">
      <div class="breath-bar-top"><div class="breath-fill"></div></div>
      <div class="expert-content">
        <div class="expert-left">
          <span class="mode-badge">EXPERT</span>
          <span class="round-info" id="roundInfo">Round 1/10</span>
          <div class="stage-steps">
            <div class="step" id="step1"><span class="step-icon">🧠</span><span>Manager</span></div>
            <span class="step-arrow">→</span>
            <div class="step" id="step2"><span class="step-icon">⚡</span><span>Executor</span></div>
            <span class="step-arrow">→</span>
            <div class="step" id="step3"><span class="step-icon">✓</span><span>Auditor</span></div>
          </div>
        </div>
        <span id="expertText">Manager 规划中</span>
      </div>
    </div>
    
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-instant" onclick="startInstant()">Instant 模式</button>
    <button class="btn btn-expert" onclick="startExpert()">Expert 模式</button>
    <button class="btn btn-secondary" onclick="stopAll()">停止</button>
  </div>
</div>

<script>
let stageInterval;
const instantStages = ['思考中...', '执行工具...', '生成回复...'];
const expertStages = ['Manager 规划中', 'Executor 执行中', 'Auditor 验证中'];
let currentStage = 0;

function startInstant() {
  stopAll();
  document.getElementById('instantBar').classList.add('active');
  document.getElementById('userMsg').textContent = '今天天气怎么样？';
  document.getElementById('assistantMsg').textContent = '让我查询一下...';
  currentStage = 0;
  updateInstantStage();
  stageInterval = setInterval(() => {
    currentStage++;
    if (currentStage >= instantStages.length) { stopAll(); return; }
    updateInstantStage();
  }, 1500);
}

function startExpert() {
  stopAll();
  document.getElementById('expertBar').classList.add('active');
  document.getElementById('userMsg').textContent = '深度分析这台主机的安全状况';
  document.getElementById('assistantMsg').textContent = '🧭 Manager Plan (Round 1)...';
  currentStage = 0;
  updateExpertStage();
  stageInterval = setInterval(() => {
    currentStage++;
    if (currentStage >= expertStages.length) {
      currentStage = 0;
      const round = parseInt(document.getElementById('roundInfo').textContent.match(/\d+/)[0]);
      document.getElementById('roundInfo').textContent = `Round ${round + 1}/10`;
    }
    updateExpertStage();
  }, 2000);
}

function updateInstantStage() {
  document.getElementById('instantText').textContent = instantStages[currentStage];
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById('dot' + i);
    dot.classList.remove('active', 'done');
    if (i - 1 < currentStage) dot.classList.add('done');
    else if (i - 1 === currentStage) dot.classList.add('active');
  }
  for (let i = 1; i <= 2; i++) {
    document.getElementById('conn' + i).classList.toggle('done', i <= currentStage);
  }
}

function updateExpertStage() {
  document.getElementById('expertText').textContent = expertStages[currentStage];
  for (let i = 1; i <= 3; i++) {
    const step = document.getElementById('step' + i);
    step.classList.remove('active', 'done');
    if (i - 1 < currentStage) step.classList.add('done');
    else if (i - 1 === currentStage) step.classList.add('active');
  }
}

function stopAll() {
  document.getElementById('instantBar').classList.remove('active');
  document.getElementById('expertBar').classList.remove('active');
  clearInterval(stageInterval);
  document.getElementById('roundInfo').textContent = 'Round 1/10';
}
</script>
</body>
</html>
