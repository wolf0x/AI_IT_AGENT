<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C3：输入框内嵌胶囊状态</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.chat-area {
  height: 400px;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
}
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

/* C3：输入框内嵌胶囊状态 */
.input-area {
  padding: 12px 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
}
.capsule-status {
  height: 0;
  overflow: hidden;
  transition: all 0.3s ease;
  margin-bottom: 0;
}
.capsule-status.active {
  height: 28px;
  margin-bottom: 8px;
}
.capsule-inner {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 4px 8px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
}
.capsule-spinner {
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.capsule-progress {
  padding: 2px 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  font-size: 10px;
}

.input-box {
  display: flex;
  gap: 8px;
  align-items: center;
}
.input-box input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.controls {
  padding: 16px;
  background: #f8f9fa;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
}
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">分析这台主机的安全状况</div>
    <div class="message assistant">🧭 Manager Plan (Round 1)<br>Subtask: 执行系统信息收集...</div>
  </div>
  
  <div class="input-area">
    <!-- C3：内嵌胶囊状态 -->
    <div class="capsule-status" id="capsuleStatus">
      <div class="capsule-inner">
        <div class="capsule-spinner"></div>
        <span id="statusText">Round 3/10</span>
        <span class="capsule-progress" id="progressText">30%</span>
      </div>
    </div>
    
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startExecution()">模拟开始执行</button>
    <button class="btn btn-secondary" onclick="stopExecution()">模拟停止</button>
  </div>
</div>

<script>
let progressInterval;
let progress = 0;
function startExecution() {
  document.getElementById('capsuleStatus').classList.add('active');
  progress = 0;
  progressInterval = setInterval(() => {
    progress = (progress + 5) % 100;
    document.getElementById('progressText').textContent = progress + '%';
  }, 500);
}
function stopExecution() {
  document.getElementById('capsuleStatus').classList.remove('active');
  clearInterval(progressInterval);
}
</script>
</body>
</html>
