<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo C — Chip Toggle</title>
<style>
:root { --t1:#1e293b; --t2:#475569; --t3:#94a3b8; --border:#e2e8f0; --rs:8px; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f1f5f9; color:var(--t1); display:flex; align-items:center; justify-content:center; min-height:100vh; }

.demo-wrap { width:720px; background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.08); overflow:hidden; }
.demo-header { padding:16px 20px; background:#f8f9fa; border-bottom:1px solid #ecf0f1; font-size:12px; color:var(--t3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }

/* ── Input bar ── */
.input-bar { display:flex; align-items:flex-end; gap:10px; padding:16px 20px; background:#f8f9fa; border-top:1px solid #ecf0f1; }
.input-bar textarea { flex:1; padding:12px 16px; background:white; border:1px solid #bdc3c7; border-radius:var(--rs); color:var(--t1); font-size:14px; outline:0; font-family:inherit; height:44px; resize:none; line-height:1.4; }
.input-bar textarea:focus { border-color:#3498db; box-shadow:0 0 0 3px rgba(52,152,219,.1); }
.btn { height:44px; display:flex; align-items:center; padding:10px 24px; border:none; border-radius:var(--rs); font-size:14px; font-weight:600; cursor:pointer; transition:all .15s; }
.btn-p { background:#3498db; color:#fff; }
.btn-p:hover { background:#2980b9; }
.btn-img { height:44px; width:44px; display:flex; align-items:center; justify-content:center; padding:0; background:#e8f4fd; border:1px solid #3498db; border-radius:var(--rs); cursor:pointer; font-size:20px; color:#3498db; flex-shrink:0; }

/* ── Demo C: Chip toggle row above input ── */
.chip-row { display:flex; align-items:center; gap:8px; padding:8px 20px; background:#f8f9fa; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; transition:all .2s; border:1px solid #d5d8dc; background:#fff; color:var(--t2); user-select:none; }
.chip:hover { border-color:#3498db; background:#f0f8ff; }
.chip.active { border-color:#8e44ad; background:#f5eef8; color:#8e44ad; font-weight:600; }
.chip .chip-dot { width:6px; height:6px; border-radius:50%; background:#bdc3c7; transition:background .2s; }
.chip.active .chip-dot { background:#8e44ad; animation:chipPulse 2s infinite; }
@keyframes chipPulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(142,68,173,.3)} 50%{opacity:.7;box-shadow:0 0 0 4px rgba(142,68,173,0)} }
.chip-label { font-size:11px; color:var(--t3); margin-left:4px; }

/* ── Scope selector (appears when managed is active) ── */
.scope-row { display:flex; align-items:center; gap:8px; padding:0 20px 8px; background:#f8f9fa; animation:fadeIn .2s ease; }
.scope-row select { padding:4px 8px; border:1px solid #d5d8dc; border-radius:6px; font-size:11px; background:#fff; color:var(--t2); outline:none; }
.scope-row label { font-size:11px; color:var(--t3); }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* ── Status ── */
.status-bar { padding:10px 20px; background:#fff; border-top:1px solid #ecf0f1; font-size:12px; color:var(--t3); display:flex; align-items:center; gap:8px; }
.status-dot { width:8px; height:8px; border-radius:50%; background:#bdc3c7; }
.status-dot.active { background:#8e44ad; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
</style>
</head>
<body>
<div class="demo-wrap">
  <div class="demo-header">Demo C — Chip Toggle</div>

  <div style="padding:40px 20px; text-align:center; color:var(--t2); font-size:14px;">
    Chat messages area...
  </div>

  <!-- Demo C: Chip row -->
  <div class="chip-row">
    <div class="chip" id="managedChip" onclick="toggleManaged()">
      <span class="chip-dot"></span>
      &#128736; Long Task
    </div>
    <span class="chip-label" id="chipLabel">Click to enable managed mode</span>
  </div>

  <!-- Scope selector (shown when managed is active) -->
  <div class="scope-row" id="scopeRow" style="display:none">
    <label>Scope:</label>
    <select id="scopeSelect">
      <option value="">Auto-detect</option>
      <option value="this_machine">This machine</option>
      <option value="network">Network segment</option>
      <option value="custom">Custom...</option>
    </select>
  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <button class="btn-img disabled" title="Attach image">&#128247;</button>
    <textarea placeholder="Type a message... (/ for skills, Shift+Enter for newline)"></textarea>
    <button class="btn btn-p">Send</button>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Managed mode: OFF</span>
  </div>
</div>

<script>
let managedOn = false;
function toggleManaged() {
  managedOn = !managedOn;
  document.getElementById('managedChip').classList.toggle('active', managedOn);
  document.getElementById('chipLabel').textContent = managedOn ? 'Managed mode active' : 'Click to enable managed mode';
  document.getElementById('scopeRow').style.display = managedOn ? 'flex' : 'none';
  document.getElementById('statusDot').classList.toggle('active', managedOn);
  document.getElementById('statusText').textContent = 'Managed mode: ' + (managedOn ? 'ON' : 'OFF');
}
</script>
</body>
</html>
