<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>发送按钮狼头 LOGO 效果</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.chat-area {
  height: 400px;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
}
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

/* 输入框区域 */
.input-area { padding: 16px; background: white; border-top: 1px solid #e2e8f0; }
.grok-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 22px;
  background: white;
  border: 2px solid #cfd9de;
  transition: border-color .3s, box-shadow .3s;
}
.grok-bar.running {
  border-color: #3498db;
  animation: grokPulseGlow 1.5s ease-in-out infinite;
}
@keyframes grokPulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(52, 152, 219, 0); }
}
.grok-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 15px;
  background: transparent;
}

/* 发送按钮 - 狼头 LOGO 样式 */
.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #3498db 0%, #2ecc71 100%);
  color: white;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  flex-shrink: 0;
}
.send-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
}
.send-btn:active {
  transform: scale(0.95);
}

/* 执行中状态 - 狼头脉冲动画 */
.send-btn.running {
  animation: wolfPulse 2s ease-in-out infinite;
}
@keyframes wolfPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.send-btn.running::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: inherit;
  animation: wolfRipple 2s ease-out infinite;
}
@keyframes wolfRipple {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* 对比：原始狼爪图标 */
.send-btn-old {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controls {
  padding: 16px;
  background: #f8f9fa;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
  flex-direction: column;
}
.control-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
.label {
  font-size: 12px;
  color: #7f8c8d;
  min-width: 100px;
}
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">分析这台主机的安全状况</div>
    <div class="message assistant">正在执行系统信息收集...</div>
  </div>
  
  <div class="input-area">
    <div class="grok-bar" id="grokBar">
      <input type="text" placeholder="输入消息..." />
      <!-- 新的狼头 LOGO 发送按钮 -->
      <button class="send-btn" id="sendBtn">🐺</button>
    </div>
  </div>
  
  <div class="controls">
    <div class="control-row">
      <span class="label">新方案（狼头）：</span>
      <button class="btn btn-primary" onclick="startRunning()">模拟执行中</button>
      <button class="btn btn-secondary" onclick="stopRunning()">停止</button>
    </div>
    <div class="control-row">
      <span class="label">旧方案（狼爪）：</span>
      <button class="send-btn-old" title="旧的狼爪图标">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7.5 8.5 L5 2 L9.5 6.5 C10.3 6 11.2 5.7 12 5.7 C12.8 5.7 13.7 6 14.5 6.5 L19 2 L16.5 8.5 C17.5 9.3 18.2 10.5 18.2 11.9 C18.2 14.7 15 16.9 12 16.9 C9 16.9 5.8 14.7 5.8 11.9 C5.8 10.5 6.5 9.3 7.5 8.5 Z"/>
          <circle cx="9" cy="10.8" r="1.1" fill="#fff" opacity=".9"/>
          <circle cx="15" cy="10.8" r="1.1" fill="#fff" opacity=".9"/>
          <ellipse cx="12" cy="14" rx="0.9" ry="0.6" fill="#fff" opacity=".85"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
function startRunning() {
  document.getElementById('grokBar').classList.add('running');
  document.getElementById('sendBtn').classList.add('running');
}

function stopRunning() {
  document.getElementById('grokBar').classList.remove('running');
  document.getElementById('sendBtn').classList.remove('running');
}
</script>
</body>
</html>
