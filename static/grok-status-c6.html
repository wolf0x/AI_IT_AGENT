<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C6：Instant 模式 + 输入框正上方</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.chat-area { height: 400px; background: #f7f9fa; padding: 20px; overflow-y: auto; }
.message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

/* Instant 模式状态条 - 输入框正上方 */
.input-area { background: white; border-top: 1px solid #e2e8f0; }
.instant-bar {
  height: 0;
  overflow: hidden;
  transition: all 0.3s ease;
  background: linear-gradient(90deg, #3498db 0%, #2ecc71 100%);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  font-size: 12px;
}
.instant-bar.active { height: 36px; padding: 8px 20px; }
.instant-left { display: flex; align-items: center; gap: 10px; }
.mode-badge {
  font-weight: 700;
  font-size: 10px;
  padding: 3px 8px;
  background: rgba(255,255,255,0.25);
  border-radius: 6px;
  letter-spacing: 0.5px;
}
.stage-steps {
  display: flex;
  align-items: center;
  gap: 6px;
}
.step {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  opacity: 0.5;
  transition: opacity 0.3s;
}
.step.active { opacity: 1; font-weight: 600; }
.step.done { opacity: 0.8; }
.step-icon { font-size: 12px; }
.step-arrow { font-size: 10px; opacity: 0.5; }

.input-box { display: flex; gap: 8px; padding: 12px 16px; align-items: center; }
.input-box input {
  flex: 1; padding: 10px 14px; border: 1px solid #e2e8f0;
  border-radius: 20px; font-size: 14px; outline: none;
}
.send-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white; cursor: pointer; font-size: 18px;
}

.controls { padding: 16px; background: #f8f9fa; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">帮我查一下北京明天的天气</div>
    <div class="message assistant">正在查询天气信息...</div>
  </div>
  
  <div class="input-area">
    <div class="instant-bar" id="instantBar">
      <div class="instant-left">
        <span class="mode-badge">INSTANT</span>
        <div class="stage-steps">
          <div class="step" id="step1">
            <span class="step-icon">🧠</span>
            <span>思考</span>
          </div>
          <span class="step-arrow">→</span>
          <div class="step" id="step2">
            <span class="step-icon">🔧</span>
            <span>工具</span>
          </div>
          <span class="step-arrow">→</span>
          <div class="step" id="step3">
            <span class="step-icon">💬</span>
            <span>回复</span>
          </div>
        </div>
      </div>
      <span id="stageText" style="font-weight:600">思考中...</span>
    </div>
    
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startInstant()">模拟 Instant 执行</button>
    <button class="btn btn-secondary" onclick="stopInstant()">停止</button>
  </div>
</div>

<script>
let stageInterval;
const stages = ['思考中...', '执行工具...', '生成回复...'];
let currentStage = 0;

function startInstant() {
  document.getElementById('instantBar').classList.add('active');
  currentStage = 0;
  updateStage();
  stageInterval = setInterval(() => {
    currentStage++;
    if (currentStage >= stages.length) { stopInstant(); return; }
    updateStage();
  }, 1500);
}

function updateStage() {
  document.getElementById('stageText').textContent = stages[currentStage];
  for (let i = 1; i <= 3; i++) {
    const step = document.getElementById('step' + i);
    step.classList.remove('active', 'done');
    if (i - 1 < currentStage) step.classList.add('done');
    else if (i - 1 === currentStage) step.classList.add('active');
  }
}

function stopInstant() {
  document.getElementById('instantBar').classList.remove('active');
  clearInterval(stageInterval);
}
</script>
</body>
</html>
