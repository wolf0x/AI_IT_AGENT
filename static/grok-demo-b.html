<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok 风格输入框 — Demo B 工具条式</title>
<style>
  :root{
    --bg:#ffffff; --page-bg:#f7f9fa; --border:#cfd9de; --border-hover:#8ecdf8;
    --text:#0f1419; --text2:#536471; --accent:#1d9bf0; --accent-hover:#1a8cd8;
    --danger:#f4212e; --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--page-bg); min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:var(--text);
  }
  .chat{width:min(680px,92vw); padding:0 12px}
  .demo-tag{font-size:12px; color:var(--text2); text-align:center; margin-bottom:18px; letter-spacing:.5px}
  .demo-tag b{color:var(--accent)}

  /* ── 输入外壳 ── */
  .shell{
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; transition:border-color .15s, box-shadow .15s;
  }
  .shell:focus-within{border-color:var(--border-hover); box-shadow:0 0 0 1px var(--border-hover)}
  .shell.dragover{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent)}

  /* ── 第一段：模式条 ── */
  .mode-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px; border-bottom:1px solid #eff3f4; background:#fafcfd;
  }
  .mode-bar .bar-l{display:flex; align-items:center; gap:10px}
  .mode-wrap{position:relative}
  .mode-btn{
    display:flex; align-items:center; gap:6px; border:none; background:#e8f4fd; color:var(--accent);
    border-radius:999px; padding:5px 12px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .mode-btn.expert{background:#f0ebfe; color:#7c3aed}
  .mode-btn svg{width:14px;height:14px}
  .mode-btn .arr{transition:transform .2s}
  .mode-wrap.open .mode-btn .arr{transform:rotate(180deg)}
  .mode-menu{
    position:absolute; top:calc(100% + 6px); left:0; min-width:240px; background:var(--bg);
    border:1px solid var(--border); border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.10);
    padding:6px; display:none; z-index:10;
  }
  .mode-wrap.open .mode-menu{display:block}
  .mode-item{display:flex; gap:10px; padding:10px; border-radius:10px; cursor:pointer; align-items:flex-start}
  .mode-item:hover{background:#f5f8fa}
  .mode-item .mi-ic{width:30px;height:30px;border-radius:8px;background:#e8f4fd;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mode-item .mi-ic svg{width:16px;height:16px;color:var(--accent)}
  .mode-item.expert .mi-ic{background:#f0ebfe}
  .mode-item.expert .mi-ic svg{color:#7c3aed}
  .mode-item .mi-t{font-size:13px;font-weight:600}
  .mode-item .mi-d{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.4}
  .mode-item .mi-chk{margin-left:auto;color:var(--accent);font-weight:700;padding-top:2px;visibility:hidden}
  .mode-item.sel .mi-chk{visibility:visible}
  .mode-desc{font-size:12px; color:var(--text2)}

  /* ── 第二段：输入区 ── */
  .input-zone{padding:14px 14px 6px}
  textarea{
    width:100%; border:none; outline:none; resize:none; background:transparent; font:inherit;
    color:var(--text); font-size:16px; line-height:1.55; max-height:220px;
  }
  textarea::placeholder{color:#8b98a5}
  .drop-hint{
    display:none; align-items:center; justify-content:center; gap:8px; padding:28px 0;
    border:2px dashed var(--accent); border-radius:12px; color:var(--accent); font-size:13px; margin:4px 0 10px;
  }
  .shell.dragover .drop-hint{display:flex}
  .shell.dragover textarea{display:none}

  /* ── 附件预览 ── */
  .preview-row{display:flex; flex-wrap:wrap; gap:8px; padding:0 14px 8px}
  .thumb{
    position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden;
    border:1px solid var(--border); background:#f5f8fa; flex-shrink:0;
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .file-ic{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:var(--text2)}
  .thumb .file-ic svg{width:20px;height:20px}
  .thumb .file-ic .ex{font-size:10px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thumb .rm{
    position:absolute; top:4px; right:4px; width:18px; height:18px; border-radius:50%; background:rgba(15,20,25,.7);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transition:opacity .15s;
  }
  .thumb:hover .rm{opacity:1}
  .thumb .rm svg{width:10px;height:10px}

  /* ── 第三段：工具栏 ── */
  .toolbar{
    display:flex; align-items:center; gap:8px; padding:8px 14px 12px; border-top:1px solid #eff3f4;
  }
  .ic-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--accent); transition:background .15s;
  }
  .ic-btn:hover{background:#e8f4fd}
  .ic-btn svg{width:18px;height:18px}
  .tool-hint{font-size:12px; color:var(--text2); margin-left:4px; flex:1}
  .counter{font-size:12px; color:var(--text2); font-variant-numeric:tabular-nums}
  .send-btn{
    width:36px; height:36px; border-radius:50%; border:none; cursor:pointer; background:var(--text); color:#fff;
    display:flex; align-items:center; justify-content:center; transition:opacity .2s, transform .1s;
  }
  .send-btn:not(:disabled):hover{transform:scale(1.06)}
  .send-btn:disabled{opacity:.35; cursor:not-allowed}
  .send-btn svg{width:16px;height:16px}
  .hint{font-size:11px; color:var(--text2); text-align:center; margin-top:10px}
</style>
</head>
<body>
<div class="chat">
  <div class="demo-tag"><b>Demo B</b> — 工具条式 · 模式条 / 输入区 / 工具栏 三段式</div>

  <div class="shell" id="shell">
    <!-- 第一段：模式条 -->
    <div class="mode-bar">
      <div class="bar-l">
        <div class="mode-wrap" id="modeWrap">
          <button class="mode-btn" id="modeBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span id="modeLabel">Instant</span>
            <svg class="arr" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
          </button>
          <div class="mode-menu" role="menu" id="modeMenu">
            <div class="mode-item sel" data-mode="Instant" role="menuitem">
              <div class="mi-ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
              <div><div class="mi-t">Instant</div><div class="mi-d">快速问答，实时响应</div></div>
              <div class="mi-chk">✓</div>
            </div>
            <div class="mode-item expert" data-mode="Expert" role="menuitem">
              <div class="mi-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg></div>
              <div><div class="mi-t">Expert</div><div class="mi-d">多轮深度调查（Manager-Executor 架构）</div></div>
              <div class="mi-chk">✓</div>
            </div>
          </div>
        </div>
        <span class="mode-desc" id="modeDesc">快速问答模式 · 单轮实时响应</span>
      </div>
    </div>

    <!-- 第二段：输入区 -->
    <div class="input-zone">
      <textarea id="ta" placeholder="Ask anything" autocapitalize="sentences" autocorrect="on" spellcheck="true" dir="auto"></textarea>
      <div class="drop-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        松开以添加文件
      </div>
    </div>

    <!-- 附件预览 -->
    <div class="preview-row" id="previewRow"></div>

    <!-- 第三段：工具栏 -->
    <div class="toolbar">
      <button class="ic-btn" id="attachBtn" type="button" aria-label="附加文件" title="附加文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <span class="tool-hint">拖拽或粘贴文件 / 图片</span>
      <span class="counter" id="counter">0 / 100000</span>
      <button class="send-btn" id="sendBtn" type="button" disabled aria-label="发送">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <input type="file" id="fileInput" multiple tabindex="-1" style="display:none"
         accept="image/*,.pdf,.docx,.xlsx,.txt,.md,.csv,.json,.xml,.yaml,.py,.js,.ts,.rs,.go,.java,.c,.cpp,.h,.sql,.sh,.html,.css">

  <div class="hint">Enter 发送 · Shift+Enter 换行 · 点击 / 拖拽 / 粘贴均可添加附件</div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const shell=$('shell'), ta=$('ta'), sendBtn=$('sendBtn'), counter=$('counter');
  const modeWrap=$('modeWrap'), modeBtn=$('modeBtn'), modeMenu=$('modeMenu');
  const modeLabel=$('modeLabel'), modeDesc=$('modeDesc');
  const previewRow=$('previewRow'), attachBtn=$('attachBtn'), fileInput=$('fileInput');
  let mode='Instant', files=[], objectUrls=[];
  const MAX_CHARS=100000;
  const MODE_DESC={Instant:'快速问答模式 · 单轮实时响应', Expert:'多轮深度调查 · Manager-Executor 长任务'};

  /* ── 模式下拉 ── */
  modeBtn.addEventListener('click',e=>{e.stopPropagation(); toggleMenu();});
  document.addEventListener('click',e=>{ if(!modeWrap.contains(e.target)) closeMenu(); });
  function toggleMenu(){
    const open=modeWrap.classList.toggle('open');
    modeBtn.setAttribute('aria-expanded',open);
  }
  function closeMenu(){ modeWrap.classList.remove('open'); modeBtn.setAttribute('aria-expanded','false'); }
  modeMenu.querySelectorAll('.mode-item').forEach(item=>{
    item.addEventListener('click',()=>{
      mode=item.dataset.mode;
      modeLabel.textContent=mode;
      modeDesc.textContent=MODE_DESC[mode];
      modeBtn.classList.toggle('expert',mode==='Expert');
      modeBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor">${
        mode==='Expert'
          ? '<path d="M11 4a7 7 0 100 14 7 7 0 000-14zm0 12a5 5 0 110-10 5 5 0 010 10zm-1-7h2v5h-2zm0-3h2v1h-2z"/>'
          : '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>'
      }</svg><span id="modeLabel2">${mode}</span><svg class="arr" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>`;
      modeLabel=$('modeLabel2');
      modeMenu.querySelectorAll('.mode-item').forEach(i=>i.classList.toggle('sel',i===item));
      closeMenu(); ta.focus();
    });
  });

  /* ── textarea ── */
  function autoGrow(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,220)+'px'; updateUI(); }
  ta.addEventListener('input',autoGrow);
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
  });

  /* ── 发送 + 计数 ── */
  function updateUI(){
    const len=ta.value.length;
    counter.textContent=`${len.toLocaleString()} / ${MAX_CHARS.toLocaleString()}`;
    counter.style.color=len>MAX_CHARS*0.9?'#f4212e':(len>MAX_CHARS*0.7?'#e2a03f':'');
    sendBtn.disabled=(!ta.value.trim()&&files.length===0)||len>MAX_CHARS;
  }
  sendBtn.addEventListener('click',send);
  function send(){
    const text=ta.value.trim();
    if(!text&&!files.length)return;
    const names=files.map(f=>f.name).join(', ');
    alert(`[${mode} 模式]\n${text||'(无文本)'}${names?('\n附件: '+names):''}`);
    ta.value=''; autoGrow();
  }

  /* ── 附件 ── */
  attachBtn.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',()=>{ addFiles(fileInput.files); fileInput.value=''; });

  ['dragenter','dragover'].forEach(ev=>shell.addEventListener(ev,e=>{e.preventDefault();shell.classList.add('dragover');}));
  ['dragleave','drop'].forEach(ev=>shell.addEventListener(ev,e=>{e.preventDefault();shell.classList.remove('dragover');}));
  shell.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  document.addEventListener('paste',e=>{
    const items=(e.clipboardData||window.clipboardData).items||[];
    let handled=false;
    for(const item of items){
      if(item.type.startsWith('image/')){
        const f=item.getAsFile(); if(f){ addFiles([f]); handled=true; }
      }
    }
    if(handled) e.preventDefault();
  });

  function addFiles(list){
    for(const f of list){
      if(files.length>=8)break;
      files.push(f);
      const thumb=document.createElement('div'); thumb.className='thumb';
      const url=URL.createObjectURL(f); objectUrls.push(url);
      if(f.type.startsWith('image/')){
        thumb.innerHTML=`<img src="${url}" alt="">`;
      }else{
        const ext=(f.name.split('.').pop()||'?').toUpperCase().slice(0,4);
        thumb.innerHTML=`<div class="file-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg><span class="ex">${ext}</span></div>`;
      }
      thumb.innerHTML+=`<span class="rm" title="移除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></span>`;
      thumb.querySelector('.rm').addEventListener('click',()=>removeFile(f,thumb));
      previewRow.appendChild(thumb);
    }
    updateUI();
  }
  function removeFile(f,el){
    files=files.filter(x=>x!==f);
    el.remove(); updateUI();
  }
})();
</script>
</body>
</html>
