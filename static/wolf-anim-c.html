<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolf Animation Demo C - Pixel Art Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }
  .container {
    width: 600px;
    background: #16213e;
    border: 3px solid #0f3460;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(15, 52, 96, 0.5);
  }
  .demo-tag {
    text-align: center;
    font-size: 11px;
    color: #e94560;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .wolf-stage {
    height: 100px;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
    background: #0f3460;
    border: 2px solid #533483;
    border-radius: 4px;
  }
  .wolf {
    position: absolute;
    width: 64px;
    height: 64px;
    bottom: 18px;
    image-rendering: pixelated;
  }
  .wolf.idle {
    left: 50%;
    transform: translateX(-50%);
    animation: pixelIdle 0.8s steps(2) infinite;
  }
  .wolf.running {
    animation: pixelRun 2s steps(8) infinite;
  }
  .wolf.done {
    left: 50%;
    transform: translateX(-50%);
    animation: pixelDone 0.4s steps(2) forwards;
  }
  @keyframes pixelIdle {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-2px); }
  }
  @keyframes pixelRun {
    0% { left: 8%; transform: scaleX(1); }
    48% { left: calc(100% - 72px); transform: scaleX(1); }
    50% { left: calc(100% - 72px); transform: scaleX(-1); }
    98% { left: 8%; transform: scaleX(-1); }
    100% { left: 8%; transform: scaleX(1); }
  }
  @keyframes pixelDone {
    0% { transform: translateX(-50%) scale(1.2); }
    100% { transform: translateX(-50%) scale(1); }
  }
  .input-box {
    display: flex;
    gap: 8px;
    padding: 10px;
    border: 2px solid #533483;
    border-radius: 4px;
    background: #0f3460;
  }
  .input-box:focus-within {
    border-color: #e94560;
    box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
  }
  .input-box textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    background: transparent;
    color: #eaeaea;
    min-height: 36px;
  }
  .input-box textarea::placeholder {
    color: #6c7a89;
  }
  .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 4px;
    border: 2px solid #e94560;
    background: transparent;
    color: #e94560;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .send-btn:hover { background: #e94560; color: #1a1a2e; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn:disabled:hover { background: transparent; color: #e94560; }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .controls button {
    padding: 6px 16px;
    border: 2px solid #533483;
    border-radius: 4px;
    background: transparent;
    color: #eaeaea;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .controls button:hover { border-color: #e94560; color: #e94560; }
  /* Pixel grid overlay */
  .wolf-stage::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 8px 8px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="demo-tag">► Demo C — 像素风格 ◄</div>
  
  <div class="wolf-stage">
    <div class="wolf idle" id="wolf">
      <!-- Pixel art front-facing wolf -->
      <svg id="wolf-front" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <!-- Ears -->
        <rect x="4" y="2" width="2" height="3" fill="#e94560"/>
        <rect x="10" y="2" width="2" height="3" fill="#e94560"/>
        <!-- Head -->
        <rect x="3" y="5" width="10" height="8" fill="#e94560"/>
        <rect x="4" y="4" width="8" height="1" fill="#e94560"/>
        <!-- Eyes -->
        <rect x="5" y="7" width="2" height="2" fill="#ffffff"/>
        <rect x="9" y="7" width="2" height="2" fill="#ffffff"/>
        <rect x="6" y="8" width="1" height="1" fill="#1a1a2e"/>
        <rect x="10" y="8" width="1" height="1" fill="#1a1a2e"/>
        <!-- Nose -->
        <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
        <!-- Mouth -->
        <rect x="6" y="11" width="1" height="1" fill="#1a1a2e"/>
        <rect x="9" y="11" width="1" height="1" fill="#1a1a2e"/>
      </svg>
      <!-- Pixel art side-running wolf -->
      <svg id="wolf-side" viewBox="0 0 20 14" shape-rendering="crispEdges" style="display:none;">
        <!-- Body -->
        <rect x="4" y="5" width="10" height="5" fill="#e94560"/>
        <rect x="5" y="4" width="8" height="1" fill="#e94560"/>
        <!-- Head -->
        <rect x="13" y="3" width="5" height="5" fill="#e94560"/>
        <rect x="14" y="2" width="3" height="1" fill="#e94560"/>
        <!-- Ear -->
        <rect x="16" y="1" width="2" height="2" fill="#e94560"/>
        <!-- Eye -->
        <rect x="16" y="4" width="1" height="1" fill="#ffffff"/>
        <!-- Nose -->
        <rect x="18" y="5" width="1" height="1" fill="#1a1a2e"/>
        <!-- Legs (running pose) -->
        <rect x="5" y="10" width="2" height="3" fill="#e94560"/>
        <rect x="8" y="10" width="2" height="2" fill="#e94560"/>
        <rect x="11" y="10" width="2" height="3" fill="#e94560"/>
        <rect x="14" y="10" width="2" height="2" fill="#e94560"/>
        <!-- Tail -->
        <rect x="2" y="5" width="2" height="2" fill="#e94560"/>
        <rect x="1" y="4" width="1" height="2" fill="#e94560"/>
      </svg>
    </div>
  </div>

  <div class="input-box">
    <textarea placeholder="> enter message..." id="input"></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <div class="controls">
    <button onclick="setState('idle')">IDLE</button>
    <button onclick="setState('running')">RUN</button>
    <button onclick="setState('done')">DONE</button>
  </div>
</div>

<script>
const wolf = document.getElementById('wolf');
const wolfFront = document.getElementById('wolf-front');
const wolfSide = document.getElementById('wolf-side');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let currentState = 'idle';

function setState(state) {
  currentState = state;
  wolf.className = 'wolf ' + state;
  
  if (state === 'running') {
    wolfFront.style.display = 'none';
    wolfSide.style.display = 'block';
  } else {
    wolfFront.style.display = 'block';
    wolfSide.style.display = 'none';
  }
}

input.addEventListener('input', () => {
  sendBtn.disabled = !input.value.trim();
});

sendBtn.addEventListener('click', () => {
  if (!input.value.trim()) return;
  setState('running');
  setTimeout(() => {
    setState('done');
    setTimeout(() => setState('idle'), 800);
  }, 3000);
  input.value = '';
  sendBtn.disabled = true;
});
</script>
</body>
</html>
