<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>G3：流动光点边框</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container { width: 600px; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
.chat-area { height: 400px; background: #f7f9fa; padding: 20px; overflow-y: auto; }
.message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

/* G3：流动光点边框 */
.input-area { padding: 16px; background: white; }
.grok-bar-wrapper {
  position: relative;
  border-radius: 22px;
  padding: 2px;
}
.grok-bar-wrapper::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 22px;
  background: #cfd9de;
}
.grok-bar-wrapper.running::before {
  background: conic-gradient(from 0deg, #cfd9de, #3498db, #9b59b6, #2ecc71, #cfd9de);
  animation: flowDot 2s linear infinite;
}
@keyframes flowDot {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
.grok-bar-wrapper.running::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  background: radial-gradient(circle, #3498db 0%, transparent 70%);
  border-radius: 50%;
  animation: moveDot 3s linear infinite;
  offset-path: path('M 22 0 L 578 0 Q 600 0 600 22 L 600 22 Q 600 44 578 44 L 22 44 Q 0 44 0 22 L 0 22 Q 0 0 22 0');
}
@keyframes moveDot {
  0% { offset-distance: 0%; }
  100% { offset-distance: 100%; }
}

.grok-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 20px;
  background: white;
  z-index: 1;
}

.grok-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 15px;
  background: transparent;
}
.send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  font-size: 16px;
}

.controls { padding: 16px; background: #f8f9fa; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">分析这台主机的安全状况</div>
    <div class="message assistant">正在执行系统信息收集...</div>
  </div>
  
  <div class="input-area">
    <div class="grok-bar-wrapper" id="grokWrapper">
      <div class="grok-bar">
        <input type="text" placeholder="输入消息..." />
        <button class="send-btn">➤</button>
      </div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startRunning()">模拟执行中</button>
    <button class="btn btn-secondary" onclick="stopRunning()">停止</button>
  </div>
</div>

<script>
function startRunning() {
  document.getElementById('grokWrapper').classList.add('running');
}
function stopRunning() {
  document.getElementById('grokWrapper').classList.remove('running');
}
</script>
</body>
</html>
