<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok 风格输入框 — Demo D 附件左置</title>
<style>
  :root{
    --bg:#ffffff; --page-bg:#f7f9fa; --border:#cfd9de; --border-hover:#8ecdf8;
    --text:#0f1419; --text2:#536471; --accent:#1d9bf0; --accent-hover:#1a8cd8;
    --danger:#f4212e; --radius:22px; --radius-btn:999px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--page-bg); min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:var(--text);
  }
  .chat{width:min(680px,92vw); padding:0 12px}
  .demo-tag{font-size:12px; color:var(--text2); text-align:center; margin-bottom:18px; letter-spacing:.5px}
  .demo-tag b{color:var(--accent)}

  /* ── 附件预览胶囊（输入框上方浮动） ── */
  .preview-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
  .pill{
    display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border);
    border-radius:var(--radius-btn); padding:4px 6px 4px 4px; font-size:12px; max-width:220px;
  }
  .pill img{width:22px;height:22px;border-radius:8px;object-fit:cover;flex-shrink:0}
  .pill .file-ic{width:22px;height:22px;border-radius:8px;background:#eef3f8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .pill .file-ic svg{width:13px;height:13px;color:var(--text2)}
  .pill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .pill .rm{cursor:pointer;color:var(--text2);display:flex;padding:2px;border-radius:50%}
  .pill .rm:hover{color:var(--danger);background:#f0f1f2}
  .pill .rm svg{width:13px;height:13px}

  /* ── 输入容器 ── */
  .box{
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
    display:flex; align-items:flex-end; gap:2px; padding:10px 12px 10px 12px;
    transition:border-color .15s, box-shadow .15s;
  }
  .box:focus-within{border-color:var(--border-hover); box-shadow:0 0 0 1px var(--border-hover)}
  .box.dragover{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); background:#f0f8ff}

  /* ── 附件按钮（最左） ── */
  .attach-btn{
    flex-shrink:0; width:38px; height:38px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--accent);
    transition:background .15s, transform .1s; position:relative;
  }
  .attach-btn:hover{background:#e8f4fd}
  .attach-btn:active{transform:scale(.92)}
  .attach-btn svg{width:19px;height:19px}
  .attach-btn.has-file{color:#0f1419}
  .attach-btn .dot{
    position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%;
    background:var(--accent); display:none;
  }
  .attach-btn.has-file .dot{display:block}

  /* ── textarea ── */
  textarea{
    flex:1; border:none; outline:none; resize:none; background:transparent; font:inherit;
    color:var(--text); font-size:15px; line-height:1.5; max-height:200px; padding:7px 4px 3px;
  }
  textarea::placeholder{color:#8b98a5}

  /* ── 模式按钮 + 下拉（发送按钮左侧） ── */
  .mode-wrap{position:relative; flex-shrink:0; padding-bottom:4px; margin-right:4px}
  .mode-btn{
    display:flex; align-items:center; gap:6px; border:none; background:transparent; cursor:pointer;
    padding:6px 8px; border-radius:12px; font-size:13px; color:var(--text); transition:background .15s;
  }
  .mode-btn:hover{background:#f0f1f2}
  .mode-btn svg{width:15px;height:15px;color:var(--accent)}
  .mode-btn.expert svg{color:#7c3aed}
  .mode-btn .arr{width:13px;height:13px;color:var(--text2);transition:transform .2s}
  .mode-wrap.open .mode-btn .arr{transform:rotate(180deg)}
  .mode-menu{
    position:absolute; bottom:calc(100% + 8px); right:0; min-width:250px; background:var(--bg);
    border:1px solid var(--border); border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.10);
    padding:6px; display:none; z-index:10;
  }
  .mode-wrap.open .mode-menu{display:block}
  .mode-item{display:flex; gap:10px; padding:10px; border-radius:10px; cursor:pointer; align-items:flex-start}
  .mode-item:hover{background:#f5f8fa}
  .mode-item .mi-ic{width:30px;height:30px;border-radius:8px;background:#e8f4fd;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mode-item .mi-ic svg{width:16px;height:16px;color:var(--accent)}
  .mode-item.expert .mi-ic{background:#f0ebfe}
  .mode-item.expert .mi-ic svg{color:#7c3aed}
  .mode-item .mi-t{font-size:13px;font-weight:600}
  .mode-item .mi-d{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.4}
  .mode-item .mi-chk{margin-left:auto;color:var(--accent);font-weight:700;padding-top:2px;visibility:hidden}
  .mode-item.sel .mi-chk{visibility:visible}

  /* ── 发送按钮（最右） ── */
  .send-btn{
    flex-shrink:0; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:var(--text); color:#fff; display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, transform .1s;
  }
  .send-btn:not(:disabled):hover{transform:scale(1.06)}
  .send-btn:disabled{opacity:.35; cursor:not-allowed}
  .send-btn svg{width:17px;height:17px}
  .hint{font-size:11px; color:var(--text2); text-align:center; margin-top:10px}
</style>
</head>
<body>
<div class="chat">
  <div class="demo-tag"><b>Demo D</b> — 附件左置 · [附件] [输入] [模式] [发送]</div>

  <!-- 附件预览 -->
  <div class="preview-row" id="previewRow"></div>

  <!-- 输入框 -->
  <div class="box" id="box">
    <!-- 最左：附件按钮 -->
    <button class="attach-btn" id="attachBtn" type="button" aria-label="Attach files" title="附加文件（点击 / 拖拽 / 粘贴）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      <span class="dot"></span>
    </button>

    <textarea id="ta" placeholder="Ask anything" autocapitalize="sentences" autocorrect="on" spellcheck="true" dir="auto"></textarea>

    <!-- 发送按钮左侧：模式切换 -->
    <div class="mode-wrap" id="modeWrap">
      <button class="mode-btn" id="modeBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span id="modeLabel">Instant</span>
        <svg class="arr" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
      <div class="mode-menu" role="menu" id="modeMenu">
        <div class="mode-item sel" data-mode="Instant" role="menuitem">
          <div class="mi-ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
          <div><div class="mi-t">Instant</div><div class="mi-d">快速问答，实时响应</div></div>
          <div class="mi-chk">✓</div>
        </div>
        <div class="mode-item expert" data-mode="Expert" role="menuitem">
          <div class="mi-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg></div>
          <div><div class="mi-t">Expert</div><div class="mi-d">多轮深度调查（Manager-Executor 架构）</div></div>
          <div class="mi-chk">✓</div>
        </div>
      </div>
    </div>

    <button class="send-btn" id="sendBtn" type="button" disabled aria-label="发送">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <input type="file" id="fileInput" multiple tabindex="-1" style="display:none"
         accept="image/*,.pdf,.docx,.xlsx,.pptx,.txt,.md,.csv,.json,.xml,.yaml,.py,.js,.ts,.rs,.go,.java,.c,.cpp,.h,.sql,.sh,.html,.css,.lua,.rb,.php">

  <div class="hint">Enter 发送 · Shift+Enter 换行 · 支持拖拽 / 粘贴 / 剪贴板图片</div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const box=$('box'), ta=$('ta'), sendBtn=$('sendBtn'), modeWrap=$('modeWrap');
  const modeBtn=$('modeBtn'), modeMenu=$('modeMenu'), modeLabel=$('modeLabel');
  const previewRow=$('previewRow'), attachBtn=$('attachBtn'), fileInput=$('fileInput');
  let mode='Instant', files=[], objectUrls=[];

  /* ── 模式下拉（右对齐弹出） ── */
  modeBtn.addEventListener('click',e=>{e.stopPropagation(); toggleMenu();});
  document.addEventListener('click',e=>{ if(!modeWrap.contains(e.target)) closeMenu(); });
  function toggleMenu(){
    const open=modeWrap.classList.toggle('open');
    modeBtn.setAttribute('aria-expanded',open);
  }
  function closeMenu(){ modeWrap.classList.remove('open'); modeBtn.setAttribute('aria-expanded','false'); }
  modeMenu.querySelectorAll('.mode-item').forEach(item=>{
    item.addEventListener('click',()=>{
      mode=item.dataset.mode;
      modeLabel.textContent=mode;
      modeBtn.classList.toggle('expert',mode==='Expert');
      modeMenu.querySelectorAll('.mode-item').forEach(i=>i.classList.toggle('sel',i===item));
      closeMenu(); ta.focus();
    });
  });

  /* ── textarea 自适应 + Enter 发送 ── */
  function autoGrow(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,200)+'px'; updateSend(); }
  ta.addEventListener('input',autoGrow);
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
  });

  /* ── 发送 ── */
  function updateSend(){ sendBtn.disabled=!ta.value.trim()&&files.length===0; }
  sendBtn.addEventListener('click',send);
  function send(){
    const text=ta.value.trim();
    if(!text&&!files.length)return;
    const names=files.map(f=>f.name).join(', ');
    alert(`[${mode} 模式]\n${text||'(无文本)'}${names?('\n附件: '+names):''}`);
    ta.value=''; autoGrow();
  }

  /* ── 附件：点击选择 ── */
  attachBtn.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',()=>{ addFiles(fileInput.files); fileInput.value=''; });

  /* ── 附件：拖拽 ── */
  ['dragenter','dragover'].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.classList.add('dragover');}));
  ['dragleave','drop'].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.classList.remove('dragover');}));
  box.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  /* ── 附件：粘贴（含剪贴板图片） ── */
  document.addEventListener('paste',e=>{
    const items=(e.clipboardData||window.clipboardData).items||[];
    let handled=false;
    for(const item of items){
      if(item.type.startsWith('image/')){
        const f=item.getAsFile(); if(f){ addFiles([f]); handled=true; }
      }
    }
    if(handled) e.preventDefault();
  });

  /* ── 文件处理 ── */
  function addFiles(list){
    for(const f of list){
      if(files.length>=8)break;
      files.push(f);
      const pill=document.createElement('div'); pill.className='pill';
      const url=URL.createObjectURL(f);
      objectUrls.push(url);
      if(f.type.startsWith('image/')){
        pill.innerHTML=`<img src="${url}" alt="">`;
      }else{
        pill.innerHTML=`<div class="file-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>`;
      }
      pill.innerHTML+=`<span class="nm">${f.name}</span><span class="rm" title="移除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></span>`;
      pill.querySelector('.rm').addEventListener('click',()=>removeFile(f,pill));
      previewRow.appendChild(pill);
    }
    attachBtn.classList.toggle('has-file',files.length>0);
    updateSend();
  }
  function removeFile(f,pill){
    files=files.filter(x=>x!==f);
    pill.remove();
    attachBtn.classList.toggle('has-file',files.length>0);
    updateSend();
  }
})();
</script>
</body>
</html>
