<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolf Animation Demo B - Gradient Silhouette</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    width: 600px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    padding: 24px;
  }
  .demo-tag {
    text-align: center;
    font-size: 12px;
    color: #8b98a5;
    margin-bottom: 16px;
  }
  .wolf-stage {
    height: 120px;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
    background: linear-gradient(180deg, #f0f4ff 0%, #e8ecf5 100%);
    border-radius: 12px;
  }
  .wolf {
    position: absolute;
    width: 100px;
    height: 100px;
    bottom: 10px;
  }
  .wolf.idle {
    left: 50%;
    transform: translateX(-50%);
    animation: idleBounce 1.5s ease-in-out infinite;
  }
  .wolf.running {
    animation: runAcross 2.5s ease-in-out infinite;
  }
  .wolf.done {
    left: 50%;
    transform: translateX(-50%);
    animation: doneSettle 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes idleBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-5px); }
  }
  @keyframes runAcross {
    0% { left: 5%; transform: scaleX(1) translateY(0); }
    10% { transform: scaleX(1) translateY(-8px); }
    20% { transform: scaleX(1) translateY(0); }
    30% { transform: scaleX(1) translateY(-8px); }
    40% { transform: scaleX(1) translateY(0); }
    45% { left: calc(100% - 105px); transform: scaleX(1) translateY(-8px); }
    50% { left: calc(100% - 105px); transform: scaleX(-1) translateY(0); }
    60% { transform: scaleX(-1) translateY(-8px); }
    70% { transform: scaleX(-1) translateY(0); }
    80% { transform: scaleX(-1) translateY(-8px); }
    90% { transform: scaleX(-1) translateY(0); }
    95% { left: 5%; transform: scaleX(-1) translateY(-8px); }
    100% { left: 5%; transform: scaleX(1) translateY(0); }
  }
  @keyframes doneSettle {
    0% { transform: translateX(-50%) scale(0.8) rotate(-5deg); }
    50% { transform: translateX(-50%) scale(1.1) rotate(3deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0); }
  }
  .wolf svg {
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  }
  .input-box {
    display: flex;
    gap: 10px;
    padding: 14px;
    border: 2px solid #e0e5ec;
    border-radius: 14px;
    transition: all 0.2s;
    background: #fafbfc;
  }
  .input-box:focus-within {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
  }
  .input-box textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-size: 14px;
    font-family: inherit;
    background: transparent;
    min-height: 40px;
  }
  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .controls button {
    padding: 8px 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .controls button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
</style>
</head>
<body>
<div class="container">
  <div class="demo-tag"><b>Demo B</b> — 渐变剪影风格</div>
  
  <div class="wolf-stage">
    <div class="wolf idle" id="wolf">
      <!-- Front-facing wolf (idle) - gradient filled -->
      <svg id="wolf-front" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="wolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
          </linearGradient>
        </defs>
        <!-- Ears -->
        <path d="M28,38 L34,16 L42,38 Z" fill="url(#wolfGrad)"/>
        <path d="M58,38 L66,16 L72,38 Z" fill="url(#wolfGrad)"/>
        <!-- Head -->
        <ellipse cx="50" cy="55" rx="24" ry="30" fill="url(#wolfGrad)"/>
        <!-- Inner ears -->
        <path d="M32,34 L35,22 L38,34 Z" fill="#8b9cf7" opacity="0.6"/>
        <path d="M62,34 L65,22 L68,34 Z" fill="#8b9cf7" opacity="0.6"/>
        <!-- Eyes -->
        <ellipse cx="42" cy="50" rx="3" ry="4" fill="white"/>
        <ellipse cx="58" cy="50" rx="3" ry="4" fill="white"/>
        <circle cx="42" cy="51" r="2" fill="#2c3e50"/>
        <circle cx="58" cy="51" r="2" fill="#2c3e50"/>
        <!-- Nose -->
        <ellipse cx="50" cy="62" rx="4" ry="3" fill="#2c3e50"/>
        <!-- Mouth -->
        <path d="M50,65 Q45,70 40,68" stroke="#2c3e50" fill="none" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M50,65 Q55,70 60,68" stroke="#2c3e50" fill="none" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <!-- Side-running wolf -->
      <svg id="wolf-side" viewBox="0 0 120 80" style="display:none;">
        <defs>
          <linearGradient id="wolfGradSide" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
          </linearGradient>
        </defs>
        <!-- Body -->
        <ellipse cx="58" cy="42" rx="34" ry="20" fill="url(#wolfGradSide)"/>
        <!-- Head -->
        <ellipse cx="90" cy="36" rx="16" ry="13" fill="url(#wolfGradSide)"/>
        <!-- Ear -->
        <path d="M94,26 L98,14 L102,28 Z" fill="url(#wolfGradSide)"/>
        <!-- Eye -->
        <ellipse cx="95" cy="34" rx="2.5" ry="3" fill="white"/>
        <circle cx="95" cy="35" r="1.5" fill="#2c3e50"/>
        <!-- Nose -->
        <circle cx="104" cy="36" r="2.5" fill="#2c3e50"/>
        <!-- Legs -->
        <path d="M40,58 L36,72 L40,72" stroke="url(#wolfGradSide)" fill="none" stroke-width="4" stroke-linecap="round"/>
        <path d="M50,58 L54,72 L50,72" stroke="url(#wolfGradSide)" fill="none" stroke-width="4" stroke-linecap="round"/>
        <path d="M68,58 L64,72 L68,72" stroke="url(#wolfGradSide)" fill="none" stroke-width="4" stroke-linecap="round"/>
        <path d="M78,58 L82,72 L78,72" stroke="url(#wolfGradSide)" fill="none" stroke-width="4" stroke-linecap="round"/>
        <!-- Tail -->
        <path d="M24,42 Q14,36 10,42" stroke="url(#wolfGradSide)" fill="none" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="input-box">
    <textarea placeholder="输入消息..." id="input"></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <div class="controls">
    <button onclick="setState('idle')">空闲</button>
    <button onclick="setState('running')">运行中</button>
    <button onclick="setState('done')">完成</button>
  </div>
</div>

<script>
const wolf = document.getElementById('wolf');
const wolfFront = document.getElementById('wolf-front');
const wolfSide = document.getElementById('wolf-side');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let currentState = 'idle';

function setState(state) {
  currentState = state;
  wolf.className = 'wolf ' + state;
  
  if (state === 'running') {
    wolfFront.style.display = 'none';
    wolfSide.style.display = 'block';
  } else {
    wolfFront.style.display = 'block';
    wolfSide.style.display = 'none';
  }
}

input.addEventListener('input', () => {
  sendBtn.disabled = !input.value.trim();
});

sendBtn.addEventListener('click', () => {
  if (!input.value.trim()) return;
  setState('running');
  setTimeout(() => {
    setState('done');
    setTimeout(() => setState('idle'), 1200);
  }, 2500);
  input.value = '';
  sendBtn.disabled = true;
});
</script>
</body>
</html>
