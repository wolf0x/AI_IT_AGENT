<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 C：聊天区域顶部状态横幅</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 700px;
  height: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 方案 C：聊天区域顶部状态横幅 */
.status-banner {
  height: 0;
  overflow: hidden;
  transition: height 0.3s ease;
  background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
.status-banner.active {
  height: 56px;
  padding: 12px 20px;
}
.status-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.status-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  animation: iconRotate 3s linear infinite;
}
@keyframes iconRotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.status-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.status-title {
  font-weight: 700;
  font-size: 14px;
}
.status-subtitle {
  font-size: 11px;
  opacity: 0.8;
}
.status-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.progress-bar {
  width: 120px;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: white;
  border-radius: 3px;
  width: 0%;
  transition: width 0.5s ease;
  animation: progressPulse 2s ease-in-out infinite;
}
@keyframes progressPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.progress-text {
  font-size: 11px;
  font-weight: 600;
}

.chat-area {
  flex: 1;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
}
.message.user {
  background: #3498db;
  color: white;
  margin-left: 60px;
}
.message.assistant {
  background: white;
  border: 1px solid #e2e8f0;
  margin-right: 60px;
}

.input-area {
  padding: 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
}
.input-box {
  display: flex;
  gap: 8px;
}
.input-box input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.controls {
  padding: 16px;
  background: #f8f9fa;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
}
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
</style>
</head>
<body>
<div class="container">
  <!-- 方案 C：顶部状态横幅 -->
  <div class="status-banner" id="statusBanner">
    <div class="status-left">
      <div class="status-icon">⚙️</div>
      <div class="status-info">
        <div class="status-title" id="statusTitle">Expert 模式执行中</div>
        <div class="status-subtitle" id="statusSubtitle">Round 3 / 10 · Executor 执行中</div>
      </div>
    </div>
    <div class="status-right">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">30%</div>
    </div>
  </div>
  
  <div class="chat-area">
    <div class="message user">分析这台主机的安全状况</div>
    <div class="message assistant">🧭 Manager Plan (Round 1)<br>Subtask: 执行系统信息收集...</div>
    <div class="message assistant">✅ Auditor 验证通过<br>发现: 系统信息已收集</div>
  </div>
  
  <div class="input-area">
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startExecution()">模拟开始执行</button>
    <button class="btn btn-secondary" onclick="stopExecution()">模拟停止</button>
  </div>
</div>

<script>
let progressInterval;
let progress = 0;

function startExecution() {
  document.getElementById('statusBanner').classList.add('active');
  progress = 0;
  progressInterval = setInterval(() => {
    progress = (progress + 5) % 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressText').textContent = progress + '%';
  }, 500);
}

function stopExecution() {
  document.getElementById('statusBanner').classList.remove('active');
  clearInterval(progressInterval);
}
</script>
</body>
</html>
