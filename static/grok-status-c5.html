<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C5：Instant 模式 + 输入框内部顶部</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.chat-area {
  height: 400px;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.message.user { background: #3498db; color: white; margin-left: 60px; }
.message.assistant { background: white; border: 1px solid #e2e8f0; margin-right: 60px; }

/* Instant 模式状态条 */
.input-wrapper { position: relative; background: white; border-top: 1px solid #e2e8f0; }
.instant-status {
  height: 0;
  overflow: hidden;
  transition: height 0.3s ease;
  background: linear-gradient(90deg, #3498db 0%, #2ecc71 100%);
  color: white;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 12px;
  gap: 12px;
}
.instant-status.active { height: 32px; padding: 6px 16px; }
.stage-dots {
  display: flex;
  gap: 4px;
  align-items: center;
}
.stage-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: all 0.3s ease;
}
.stage-dot.active {
  background: white;
  transform: scale(1.3);
}
.stage-dot.done {
  background: rgba(255,255,255,0.7);
}
.stage-connector {
  width: 12px;
  height: 2px;
  background: rgba(255,255,255,0.3);
}
.stage-connector.done { background: rgba(255,255,255,0.7); }

.input-box { display: flex; gap: 8px; padding: 12px 16px; align-items: center; }
.input-box input {
  flex: 1; padding: 10px 14px; border: 1px solid #e2e8f0;
  border-radius: 20px; font-size: 14px; outline: none;
}
.send-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white; cursor: pointer; font-size: 18px;
}

.controls { padding: 16px; background: #f8f9fa; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-primary { background: #3498db; color: white; }
.btn-secondary { background: #95a5a6; color: white; }
.mode-label { font-weight: 700; font-size: 11px; padding: 4px 8px; background: rgba(255,255,255,0.2); border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">今天天气怎么样？</div>
    <div class="message assistant">让我查询一下天气信息...</div>
  </div>
  
  <div class="input-wrapper">
    <div class="instant-status" id="instantStatus">
      <span class="mode-label">INSTANT</span>
      <div class="stage-dots">
        <div class="stage-dot" id="dot1"></div>
        <div class="stage-connector" id="conn1"></div>
        <div class="stage-dot" id="dot2"></div>
        <div class="stage-connector" id="conn2"></div>
        <div class="stage-dot" id="dot3"></div>
      </div>
      <span id="stageText">思考中...</span>
    </div>
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startInstant()">模拟 Instant 执行</button>
    <button class="btn btn-secondary" onclick="stopInstant()">停止</button>
  </div>
</div>

<script>
let stageInterval;
const stages = ['思考中...', '执行工具...', '生成回复...'];
let currentStage = 0;

function startInstant() {
  document.getElementById('instantStatus').classList.add('active');
  currentStage = 0;
  updateStage();
  stageInterval = setInterval(() => {
    currentStage++;
    if (currentStage >= stages.length) {
      stopInstant();
      return;
    }
    updateStage();
  }, 1500);
}

function updateStage() {
  document.getElementById('stageText').textContent = stages[currentStage];
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById('dot' + i);
    dot.classList.remove('active', 'done');
    if (i - 1 < currentStage) dot.classList.add('done');
    else if (i - 1 === currentStage) dot.classList.add('active');
  }
  for (let i = 1; i <= 2; i++) {
    const conn = document.getElementById('conn' + i);
    conn.classList.remove('done');
    if (i <= currentStage) conn.classList.add('done');
  }
}

function stopInstant() {
  document.getElementById('instantStatus').classList.remove('active');
  clearInterval(stageInterval);
}
</script>
</body>
</html>
