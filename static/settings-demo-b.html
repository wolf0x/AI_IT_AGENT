<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Demo B - Inline Labels</title>
<style>
:root {
  --t1: #1e293b; --t2: #475569; --t3: #94a3b8;
  --border: #e2e8f0; --rs: 8px; --mono: 'Consolas', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: var(--t1); }

.settings-scroll { padding: 20px; max-width: 900px; margin: 0 auto; }

/* Demo B: Inline Labels - horizontal form layout */
.settings-section {
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(12px);
  border-radius: 14px;
  padding: 16px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
  margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,.8);
}
.settings-section h3 {
  font-size: 13px; font-weight: 600; color: #1e293b;
  margin: 0 0 12px 0; display: flex; align-items: center; gap: 6px;
}

/* Inline form row: label and input on same line */
.form-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid #f8fafc;
}
.form-row:last-child { border-bottom: none; }
.form-row label {
  flex: 0 0 140px; font-size: 12px; font-weight: 500;
  color: var(--t2); white-space: nowrap;
}
.form-row input, .form-row select {
  flex: 1; padding: 7px 10px; background: #f8fafc;
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--t1); font-size: 13px; outline: none;
  transition: border-color 0.15s;
}
.form-row input:focus, .form-row select:focus {
  border-color: #3b82f6;
}
.form-row small { font-size: 10px; color: var(--t3); flex: 0 0 160px; }

/* Compact button row */
.btn-row { display: flex; gap: 6px; margin-top: 10px; }
.btn {
  padding: 6px 12px; border-radius: 6px; font-size: 11px;
  font-weight: 500; cursor: pointer; border: none; transition: all 0.15s;
}
.btn-p { background: #3b82f6; color: white; }
.btn-p:hover { background: #2563eb; }
.btn-s { background: #f1f5f9; color: var(--t2); border: 1px solid var(--border); }
.btn-s:hover { background: #e2e8f0; }
.btn-d { background: #ef4444; color: white; }
.btn-d:hover { background: #dc2626; }

/* Toggle switch */
.perm-toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.perm-toggle input { opacity: 0; width: 0; height: 0; }
.perm-toggle .slider {
  position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
  background: #cbd5e1; border-radius: 20px; transition: 0.2s;
}
.perm-toggle .slider:before {
  position: absolute; content: ""; height: 14px; width: 14px;
  left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s;
}
.perm-toggle input:checked + .slider { background: #3b82f6; }
.perm-toggle input:checked + .slider:before { transform: translateX(16px); }

/* Provider list */
.provider-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; background: #f8fafc; border-radius: 6px;
  margin-bottom: 6px; font-size: 12px;
}
.provider-item .name { font-weight: 500; }
.provider-item .url { color: var(--t3); font-size: 11px; }

/* Config tabs */
.config-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.config-tab {
  padding: 4px 8px; font-size: 10px; border-radius: 4px;
  cursor: pointer; border: 1px solid var(--border);
  background: white; color: var(--t2); transition: all 0.15s;
}
.config-tab.active { background: #3b82f6; color: white; border-color: #3b82f6; }

textarea {
  width: 100%; padding: 8px; background: #f8fafc;
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--t1); font-size: 11px; font-family: var(--mono);
  resize: vertical; line-height: 1.5;
}

/* Permission inline */
.perm-inline { display: flex; gap: 12px; flex-wrap: wrap; }
.perm-inline .perm-item {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
}

/* Two column layout for sections */
.two-col {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}

/* Demo badge */
.demo-badge {
  position: fixed; top: 10px; right: 10px;
  background: #10b981; color: white; padding: 6px 12px;
  border-radius: 6px; font-size: 12px; font-weight: 600;
  z-index: 1000;
}
</style>
</head>
<body>
<div class="demo-badge">Demo B: Inline Labels</div>
<div class="settings-scroll">

  <!-- Connection -->
  <div class="settings-section">
    <h3>🔗 Connection</h3>
    <div class="form-row">
      <label>WebSocket URL</label>
      <input type="text" value="ws://localhost:7788/ws">
    </div>
    <div class="form-row">
      <label>Password</label>
      <input type="password" value="123">
      <div style="display:flex;gap:6px;flex:0 0 auto">
        <button class="btn btn-p">Connect</button>
        <button class="btn btn-s">Disconnect</button>
      </div>
    </div>
  </div>

  <!-- Model -->
  <div class="settings-section">
    <h3>🤖 Model</h3>
    <div class="form-row">
      <label>Primary Model</label>
      <select><option>gpt-4o</option></select>
    </div>
    <div class="form-row">
      <label>Fallback Model</label>
      <select><option>None</option></select>
    </div>
  </div>

  <!-- Provider -->
  <div class="settings-section">
    <h3>🔐 Provider</h3>
    <div class="form-row">
      <label>Name</label>
      <input type="text" placeholder="e.g. gpt-4o">
    </div>
    <div class="form-row">
      <label>API Base URL</label>
      <input type="text" placeholder="https://api.openai.com/v1">
    </div>
    <div class="form-row">
      <label>API Key</label>
      <input type="password" placeholder="optional">
    </div>
    <div class="form-row">
      <label>Env Var</label>
      <input type="text" placeholder="OPENAI_API_KEY">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">
      <div class="form-row" style="border:none;padding:0">
        <label style="flex:0 0 50px">Ctx</label>
        <input type="number" value="128000">
      </div>
      <div class="form-row" style="border:none;padding:0">
        <label style="flex:0 0 50px">Tokens</label>
        <input type="number" value="16384">
      </div>
      <div class="form-row" style="border:none;padding:0">
        <label style="flex:0 0 40px">Temp</label>
        <input type="number" value="0.7" step="0.1">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-p">+ Add Model</button>
      <button class="btn btn-s">Cancel</button>
    </div>
    <div style="margin-top:10px">
      <div class="provider-item">
        <span class="name">gpt-4o</span>
        <span class="url">api.openai.com</span>
      </div>
    </div>
  </div>

  <!-- Agent - Two column -->
  <div class="settings-section">
    <h3>⚙️ Agent</h3>
    <div class="two-col">
      <div>
        <div class="form-row">
          <label style="flex:0 0 90px">Iterations</label>
          <input type="number" value="100">
        </div>
        <div class="form-row">
          <label style="flex:0 0 90px">Rabbit Hole</label>
          <input type="number" value="10">
        </div>
        <div class="form-row">
          <label style="flex:0 0 90px">Ctx Thresh %</label>
          <input type="number" value="80">
        </div>
      </div>
      <div>
        <div class="form-row">
          <label style="flex:0 0 70px">Timeout</label>
          <input type="number" value="300">
        </div>
        <div class="form-row">
          <label style="flex:0 0 70px">Retries</label>
          <input type="number" value="2">
        </div>
        <div class="form-row">
          <label style="flex:0 0 70px">Timezone</label>
          <input type="number" value="8">
        </div>
      </div>
    </div>
    <div class="form-row" style="margin-top:8px;border:none">
      <label>🖥️ Computer Use</label>
      <span style="flex:1;font-size:11px;color:var(--t3)">Screenshot, mouse, keyboard tools</span>
      <label class="perm-toggle"><input type="checkbox"><span class="slider"></span></label>
    </div>
  </div>

  <!-- Config + Session combined -->
  <div class="two-col">
    <div class="settings-section">
      <h3>📄 Config</h3>
      <div class="config-tabs">
        <span class="config-tab active">AGENTS</span>
        <span class="config-tab">SOUL</span>
        <span class="config-tab">TOOLS</span>
        <span class="config-tab">MEMORY</span>
      </div>
      <textarea rows="10" placeholder="Select a file..."></textarea>
      <div class="btn-row">
        <button class="btn btn-p">Save</button>
        <button class="btn btn-s">Reload</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>💾 Session & Permissions</h3>
      <div class="btn-row" style="margin-top:0;margin-bottom:12px">
        <button class="btn btn-d">Clear Chat</button>
        <button class="btn btn-s">Export</button>
      </div>
      <label style="font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px;display:block">Permissions</label>
      <div class="perm-inline">
        <div class="perm-item">
          <span>read</span>
          <label class="perm-toggle"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="perm-item">
          <span>write</span>
          <label class="perm-toggle"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="perm-item">
          <span>delete</span>
          <label class="perm-toggle"><input type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="perm-item">
          <span>modify</span>
          <label class="perm-toggle"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="perm-item">
          <span>execute</span>
          <label class="perm-toggle"><input type="checkbox"><span class="slider"></span></label>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
