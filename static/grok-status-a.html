<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 A：输入框上方浮动状态条</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.chat-area {
  height: 400px;
  background: #f7f9fa;
  padding: 20px;
  overflow-y: auto;
}
.message {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
}
.message.user {
  background: #3498db;
  color: white;
  margin-left: 60px;
}
.message.assistant {
  background: white;
  border: 1px solid #e2e8f0;
  margin-right: 60px;
}

/* 方案 A：输入框上方浮动状态条 */
.status-bar {
  height: 0;
  overflow: hidden;
  transition: height 0.3s ease;
  background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #667eea 100%);
  background-size: 200% 100%;
  animation: gradientShift 3s ease infinite;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 13px;
  font-weight: 600;
  gap: 8px;
}
.status-bar.active {
  height: 36px;
}
.status-bar .spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.input-area {
  padding: 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
}
.input-box {
  display: flex;
  gap: 8px;
  align-items: center;
}
.input-box input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
.input-box input:focus {
  border-color: #3498db;
}
.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2ecc71 0%, #1abc9c 100%);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.send-btn.running {
  animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
}

.controls {
  padding: 16px;
  background: #f8f9fa;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
}
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary {
  background: #3498db;
  color: white;
}
.btn-secondary {
  background: #95a5a6;
  color: white;
}
</style>
</head>
<body>
<div class="container">
  <div class="chat-area">
    <div class="message user">分析这台主机的安全状况</div>
    <div class="message assistant">🧭 Manager Plan (Round 1)<br>Subtask: 执行系统信息收集...</div>
  </div>
  
  <!-- 方案 A：浮动状态条 -->
  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span id="statusText">Executor 执行中...</span>
  </div>
  
  <div class="input-area">
    <div class="input-box">
      <input type="text" placeholder="输入消息..." />
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startExecution()">模拟开始执行</button>
    <button class="btn btn-secondary" onclick="stopExecution()">模拟停止</button>
  </div>
</div>

<script>
let statusInterval;
const stages = [
  'Manager 思考中...',
  'Executor 执行中...',
  'Auditor 验证中...',
  'Manager 规划下一轮...'
];
let stageIndex = 0;

function startExecution() {
  document.getElementById('statusBar').classList.add('active');
  document.getElementById('sendBtn').classList.add('running');
  stageIndex = 0;
  statusInterval = setInterval(() => {
    stageIndex = (stageIndex + 1) % stages.length;
    document.getElementById('statusText').textContent = stages[stageIndex];
  }, 2000);
}

function stopExecution() {
  document.getElementById('statusBar').classList.remove('active');
  document.getElementById('sendBtn').classList.remove('running');
  clearInterval(statusInterval);
}
</script>
</body>
</html>
